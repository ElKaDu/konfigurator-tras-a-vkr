<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist zásilky — wireframe v3 · varianta B (seznam + agenda hovoru)</title>
<style>
:root{
  --bg:#E2E3ED; --card:#fff; --ink:#403854; --mut:#837D96; --faint:#ADA8BC;
  --line:#E4E1EB; --line2:#EFEDF5; --well:#F5F5FA; --sep:#E7E6EF;
  --accent:#8C57FF; --shadow:0 1px 2px rgba(46,38,61,.06); --shadow2:0 8px 28px rgba(46,38,61,.18);
  --ok:#4CAF50; --zji:#9891A8; --res:#EA580C; --inf:#00A9BE; --pot:#F59E0B; --zme:#D9A400;
  --rus:#EF4444; --cek:#4C7EFF; --accent2:#A87FFF;
  --ok-bg:#eef7ee; --pot-bg:#fdf3e2; --rus-bg:#fdecec; --zji-bg:#f1effa;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#242038; --card:#2f2b45; --ink:#E7E3FC; --mut:#A49FBD; --faint:#736D8C;
  --line:#453F63; --line2:#3B3557; --well:#282443; --sep:#1E1B30;
  --accent:#A98BFF; --shadow:0 1px 2px rgba(0,0,0,.3); --shadow2:0 8px 28px rgba(0,0,0,.5);
  --ok-bg:#2b3a2c; --pot-bg:#41372a; --rus-bg:#432b2d; --zji-bg:#363152;
}}
:root[data-theme="dark"]{
  --bg:#242038; --card:#2f2b45; --ink:#E7E3FC; --mut:#A49FBD; --faint:#736D8C;
  --line:#453F63; --line2:#3B3557; --well:#282443; --sep:#1E1B30;
  --accent:#A98BFF; --shadow:0 1px 2px rgba(0,0,0,.3); --shadow2:0 8px 28px rgba(0,0,0,.5);
  --ok-bg:#2b3a2c; --pot-bg:#41372a; --rus-bg:#432b2d; --zji-bg:#363152;
}
:root[data-theme="light"]{
  --bg:#f2f3f8; --card:#fff; --ink:#2E263D; --mut:#7A748C; --faint:#A7A2B8;
  --line:#E4E1EB; --line2:#EFEDF5; --well:#F7F7FB; --sep:#E7E6EF;
  --accent:#8C57FF; --ok-bg:#eef7ee; --pot-bg:#fdf3e2; --rus-bg:#fdecec; --zji-bg:#f1effa;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
     font:14px/1.5 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;min-width:1420px}
button{font:inherit;color:inherit}
textarea{font:inherit}

/* ═══ stavy — barvu nese ikona, ne plocha ═══ */
.sic{font-style:normal;font-weight:700;font-size:11px;width:15px;height:15px;flex:none;line-height:1;
     display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
     background:color-mix(in srgb,var(--sc,var(--faint)) 18%,transparent);color:var(--sc,var(--faint))}
.sic-zme{font-size:13px;font-weight:900;background:color-mix(in srgb,var(--sc) 30%,transparent)}
.sic-ok{--sc:var(--ok)} .sic-zji{--sc:var(--mut)} .sic-res{--sc:var(--res)} .sic-inf{--sc:var(--inf)}
.sic-pot{--sc:var(--pot)} .sic-zme{--sc:var(--zme)} .sic-rus{--sc:var(--rus)} .sic-cek{--sc:var(--cek)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);font-weight:600;white-space:nowrap}
.s-ok{--sc:var(--ok)} .s-zji{--sc:var(--zji)} .s-res{--sc:var(--res)} .s-inf{--sc:var(--inf)}
.s-pot{--sc:var(--pot)} .s-zme{--sc:var(--zme)} .s-rus{--sc:var(--rus)} .s-cek{--sc:var(--cek)}

/* ============ top ============ */
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top-r1{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline;padding:10px 22px 0}
/* souhrn vlevo a stav checklistu vpravo stojí na jedné lince */
.top-r2{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:8px 22px 10px}
.top h1{font-size:15px;margin:0;font-weight:650}
.top h1 span{color:var(--mut);font-weight:400}
.ship{color:var(--mut);font-size:12.5px}
.ship b{color:var(--ink);font-weight:600}
/* jeden souhrnný pruh: kde stojí všech 28 položek */
.sum{display:flex;flex-direction:column;gap:6px;flex:1;min-width:330px;max-width:620px}
.sumbar{display:flex;height:11px;border-radius:6px;overflow:hidden;background:var(--line2);gap:2px}
.sumbar i{display:block;transition:width .35s cubic-bezier(.4,0,.2,1)}
/* „na hovoru“ = tlumená břidlicová, aby seděla na klidné řádky ve 2. sloupci;
   „čeká na zákazníka“ = sytá modrá, stejně jako tam */
.sg-done{background:var(--ok)} .sg-call{background:color-mix(in srgb,var(--cek) 42%,var(--faint))}
.sg-wait{background:var(--cek)} .sg-loose{background:var(--res)}
.sumleg{display:flex;flex-wrap:wrap;gap:3px 13px;font-size:11.5px;color:var(--mut)}
.sumleg .tot{color:var(--faint);margin-left:2px}
.lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lg::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--lc,var(--line2));flex:none}
.lg b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.lg.zero{opacity:.4}
.lg-done{--lc:var(--ok)} .lg-call{--lc:color-mix(in srgb,var(--cek) 42%,var(--faint))} .lg-wait{--lc:var(--cek)}
.lg-loose{--lc:var(--res)} .lg-todo{--lc:var(--faint)}
.lg.tot::before{display:none}
.gstat{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:650;font-size:13px;
       padding:5px 14px;border-radius:20px;border:1px solid var(--line)}
.gstat.g-ok{background:var(--ok-bg);border-color:transparent}
.gstat.g-pot{background:var(--pot-bg);border-color:transparent}
.gstat.g-rus{background:var(--rus-bg);border-color:transparent}
.gstat.g-zji{background:var(--well);border-color:transparent}
.gsub{font-weight:400;color:var(--mut);font-size:11.5px}
.banner{display:none;background:var(--rus-bg);border-bottom:1px solid var(--rus);padding:8px 22px;
        font-weight:600;font-size:13px}
.banner.on{display:block}
.banner em{font-weight:400;color:var(--mut);font-style:normal}

/* ============ board ============ */
.board{display:grid;grid-template-columns:250px minmax(560px,1fr) minmax(390px,430px);
       gap:16px;align-items:stretch;max-width:2200px;margin:0 auto;
       height:calc(100vh - var(--th,120px));overflow:hidden;padding:14px 18px 16px}
.col{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;
     display:flex;flex-direction:column;min-height:0;max-height:100%;--cc:var(--accent)}
.col-call{--cc:var(--accent2)}
.col-h{flex:none;padding:12px 16px 11px;display:flex;flex-direction:column;gap:9px;
       background:var(--card);border-bottom:1px solid var(--line)}
.ch-top{display:flex;align-items:center;gap:10px}
.ch-t{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink);
      display:inline-flex;align-items:center;gap:9px}
.ch-t::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--cc);flex:none}
.ch-n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;margin-left:auto;color:var(--cc)}
.ch-n em{font-style:normal;font-size:12px;font-weight:500;color:var(--mut);opacity:.7}
.ch-sub{font-size:11px;color:var(--mut);margin-top:-3px}
.ch-row{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:-1px}
.stchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;cursor:pointer;
  padding:3px 9px;border-radius:14px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.stchip .x{color:var(--mut);font-weight:400}
.stchip:hover .x{color:var(--ink)}
.ch-row .ch-sub{margin:0;flex:1;min-width:190px}
.toc-hid{font-size:10.5px;color:var(--faint);padding:9px 14px 0;font-style:italic}
.col-b{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--well);padding:2px;gap:2px}
.segs button{background:none;border:none;border-radius:6px;padding:3px 9px;font-size:11px;cursor:pointer;color:var(--mut)}
.segs button:hover{color:var(--ink)}
.segs button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(64,56,84,.13)}

/* ============ 1. sloupec — OBSAH ============ */
.toc{padding:8px 0 14px}
.toc-a{display:block;padding:6px 14px 6px 13px;cursor:pointer;text-decoration:none;border-left:3px solid transparent}
.toc-a:hover{background:var(--well)}
.toc-a.on{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.toc-a.off{opacity:.45}
.toc-r1{display:flex;align-items:baseline;gap:8px}
.toc-nm{font-size:12.5px;font-weight:600;color:var(--ink);flex:1;line-height:1.3}
.toc-n{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
.toc-dots{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--sc,var(--line));flex:none}
.dot.none{background:transparent;border:1.5px dashed var(--faint);width:8px;height:8px}
.toc-cond{font-size:10px;color:var(--faint);border:1px dashed var(--line);border-radius:5px;padding:0 5px}
.toc-h{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
       padding:12px 14px 5px}
.legend{padding:4px 8px 0;border-top:1px solid var(--line);margin-top:10px}
.leg-r{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-size:11px;color:var(--mut);
  padding:4px 6px;background:none;border:none;border-radius:6px;cursor:pointer}
.leg-r b{color:var(--ink);font-weight:600;flex:1}
.leg-r .n{font-variant-numeric:tabular-nums;color:var(--mut);font-weight:600}
.leg-r:hover{background:var(--well)}
.leg-r.on{background:color-mix(in srgb,var(--accent) 12%,transparent);
  box-shadow:inset 2px 0 0 var(--accent)}
.leg-r.on b,.leg-r.on .n{color:var(--ink)}
.leg-r.zero{opacity:.4;cursor:default}
.leg-r.zero:hover{background:none}
.dot.off{opacity:.22}

/* ============ 2. sloupec — POLOŽKY ============ */
.area+.area{border-top:10px solid var(--sep)}
.area-h{position:sticky;top:0;z-index:8;background:var(--card)}
.area-t{display:flex;align-items:baseline;gap:10px;padding:14px 16px 7px}
.area-t h2{font-size:12.5px;margin:0;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink)}
.area-t .pr{color:var(--faint);font-size:11px;margin-left:auto;font-variant-numeric:tabular-nums}
.ctxbox{display:flex;flex-wrap:wrap;gap:2px 8px;padding:7px 16px;
        background:color-mix(in srgb,var(--accent) 9%,var(--card));
        border-bottom:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
        font-size:11px;color:var(--mut)}
.kv{padding:1px 6px;border-radius:5px;border:1px solid transparent}
.kv b{color:var(--ink);font-weight:600}
.kv.hi{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:var(--accent);color:var(--ink)}
.grp{padding:13px 16px 0;font-size:11.5px;color:var(--mut);font-weight:600}
.cards{padding:11px 13px 13px;display:flex;flex-direction:column;gap:10px}

.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px 11px;background:var(--well);position:relative}
/* hotová položka — jeden řádek, barvu nese celá karta podle výsledného stavu */
.card.done{background:color-mix(in srgb,var(--sc) 10%,var(--card));
  border-color:color-mix(in srgb,var(--sc) 32%,transparent);padding:0;overflow:hidden}
.rowwrap{display:flex;align-items:center;gap:9px;padding-right:11px}
.donerow{display:flex;align-items:center;gap:8px;flex:1;min-width:0;width:100%;text-align:left;background:none;border:none;
  padding:7px 11px;cursor:pointer;flex-wrap:wrap;line-height:1.35}
/* tlačítko na řádku je tiché a šedé — zezelená až výsledek, ne cesta k němu */
/* akce na řádku — bez rámečku, jen text; zezelená při najetí */
.mini.rowact{flex:none;font-weight:600;white-space:nowrap;color:var(--mut);background:none;border:none;padding:3px 6px}
.mini.rowact:hover{color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.donerow:hover{background:color-mix(in srgb,var(--sc) 8%,transparent)}
.donerow .dn{font-size:12.5px;font-weight:650;color:var(--ink)}
.donerow .dv{font-size:12.5px;color:var(--mut)}
.donerow .tg{display:flex;gap:3px;font-size:10.5px;opacity:.75}
/* meta stojí uvnitř řádku (agenda hovoru) i vedle něj (2. sloupec) — musí platit pro obojí */
.dm{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
.dm.ag{color:var(--mut);font-weight:600}
.dm.warn{color:var(--res);font-weight:600}
.donenote{padding:0 11px 7px;font-size:11.5px;color:var(--mut);white-space:pre-wrap;line-height:1.45}
.doneact{display:none;gap:12px;padding:0 11px 8px}
.card.done:hover .doneact,.card.done:focus-within .doneact,
.card.onag:hover .doneact,.card.onag:focus-within .doneact,
.card.orphaned:hover .doneact,.card.orphaned:focus-within .doneact{display:flex}
/* na agendě hovoru — přesně stejná plocha i rámeček jako neposouzená kartička;
   odlišuje ji jen jeden řádek a značka vpravo (📞 zóna / ✓ Potvrdit) */
.card.onag{background:var(--well);border-color:var(--line);padding:0;overflow:hidden}
.card.onag .donerow:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
/* rozhodnuto, ale nikde se to neřeší — jediný stav, který má být vidět jako nedodělek */
.card.orphaned{background:var(--card);border:1px dashed var(--res);padding:0;overflow:hidden}
.card.orphaned .donerow:hover{background:color-mix(in srgb,var(--res) 7%,transparent)}
.card .crumb{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:2px}
.card .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.card .nm{font-weight:650;font-size:13px}
.card.done .nm{color:var(--mut);font-weight:600}
.card .dsc{color:var(--mut);font-size:11.5px;margin:0 0 8px;max-width:82ch}
.card .rel{font-size:10.5px;color:var(--mut);margin:9px 0 0;padding:6px 9px;line-height:1.55;
           background:color-mix(in srgb,var(--accent) 9%,var(--card));border-radius:6px}
.card .rel b{color:var(--ink);font-weight:600}
.flag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--pot-bg);
      border:1px solid var(--pot);cursor:help}
.cnd{font-size:10px;color:var(--faint);border:1px dashed var(--line);border-radius:5px;padding:1px 7px}

.opts{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.orow{--sc:var(--faint);display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:var(--card);
      border:none;border-top:1px solid var(--line2);padding:6px 10px;cursor:pointer;position:relative}
.orow:first-child{border-top:none}
.orow:hover{background:color-mix(in srgb,var(--accent) 7%,var(--card))}
.orow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.orow .rd{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);flex:none;background:var(--card)}
.orow:hover .rd{border-color:var(--mut)}
.orow .txt{flex:1;font-size:12.5px;line-height:1.35}
.orow .tg{display:flex;gap:3px;flex:none;font-size:10.5px;opacity:.75}
.orow .st{width:118px;justify-content:flex-start}
.orow .info{flex:none;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);color:var(--mut);
      display:flex;align-items:center;justify-content:center;font-size:10px;font-style:italic;font-family:Georgia,serif;
      opacity:0;transition:opacity .12s}
.orow:hover .info{opacity:1}
.osep{height:1px;background:var(--line)}
.orow.sel{font-weight:600;box-shadow:inset 3px 0 0 var(--sc);background:color-mix(in srgb,var(--sc) 6%,var(--card))}
.orow.sel .rd{border:4.5px solid var(--sc)}
.orow.sel .st{color:var(--ink)}

.chosen{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;
        padding:0;margin-top:6px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);line-height:1.4}
.chosen:hover{color:var(--accent)}
.chosen .ct{flex:1}
.chosen .tg{display:flex;gap:4px;font-size:11px;opacity:.7;font-weight:400}
.card.done .chosen{font-weight:500;color:var(--mut)}

.cardbar{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:11px;color:var(--mut);flex-wrap:wrap}
.mini{background:var(--card);border:1px solid var(--line);border-radius:6px;font-size:11px;padding:3px 9px;cursor:pointer}
.mini:hover{border-color:var(--mut)}
.mini.on{border-color:var(--accent2);color:var(--accent2);background:color-mix(in srgb,var(--accent2) 8%,var(--card));font-weight:600}
.lnk{background:none;border:none;color:var(--mut);font-size:11px;cursor:pointer;text-decoration:underline;padding:0}
.lnk:hover{color:var(--ink)}
.cardbar .right{margin-left:auto}

/* proužek „tahle položka je i v agendě“ — nositel duplikace */
.dup{display:flex;align-items:center;gap:7px;margin-top:9px;padding:5px 9px;border-radius:7px;font-size:11px;
     background:color-mix(in srgb,var(--accent2) 11%,var(--card));
     border:1px solid color-mix(in srgb,var(--accent2) 32%,transparent);color:var(--mut);cursor:pointer}
.dup b{color:var(--ink);font-weight:650}
.dup:hover{background:color-mix(in srgb,var(--accent2) 18%,var(--card))}
.dup.wait{background:color-mix(in srgb,var(--cek) 10%,var(--card));border-color:color-mix(in srgb,var(--cek) 32%,transparent)}
.dup.done{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.dup .go{margin-left:auto;text-decoration:underline;white-space:nowrap}
.orphan{color:var(--res)}

/* ============ 3. sloupec — HOVOR ============ */
.callwrap{display:flex;flex-direction:column;gap:14px;min-height:0;max-height:100%}
.callhead{padding:11px 16px;background:color-mix(in srgb,var(--accent2) 9%,var(--card));
          border-bottom:1px solid color-mix(in srgb,var(--accent2) 25%,transparent);
          display:flex;align-items:center;gap:10px;font-size:12.5px}
.callhead .ci{font-size:17px}
.callhead b{font-weight:650}
.callhead .lnk{margin-left:auto}
.zone{border-top:1px solid var(--line)}
.zone:first-child{border-top:none}
.zone-h{position:sticky;top:0;z-index:5;padding:9px 16px 8px;background:var(--card);font-size:11.5px;font-weight:700;
        letter-spacing:.07em;display:flex;align-items:center;gap:8px;color:var(--ink);text-transform:uppercase;
        border-bottom:1px solid var(--line)}
.zone-h .c{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;color:var(--mut);letter-spacing:0}
.zt-ok{--zt:var(--ok)} .zt-zji{--zt:var(--zji)} .zt-res{--zt:var(--res)} .zt-inf{--zt:var(--inf)}
.zt-pot{--zt:var(--pot)} .zt-cek{--zt:var(--cek)}
.zone.tint .zone-h{background:color-mix(in srgb,var(--zt) 17%,var(--card));
        border-bottom-color:color-mix(in srgb,var(--zt) 30%,transparent)}
.zone.tint{background:color-mix(in srgb,var(--zt) 6%,var(--card))}
.zone .cards{padding:10px 12px 12px}
.zone .card{background:var(--card)}

.ag-h{display:flex;align-items:flex-start;gap:8px}
.ag-nm{font-size:12.5px;font-weight:650;flex:1;line-height:1.35}
.ag-crumb{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.ag-find{font-size:12px;color:var(--mut);margin-top:4px;display:flex;gap:7px;align-items:flex-start}
.ag-find b{color:var(--ink);font-weight:600}
.ag-note{width:100%;margin-top:8px;min-height:46px;resize:none;overflow:hidden;border:1px solid var(--line);border-radius:7px;
         background:var(--well);color:var(--ink);padding:7px 9px;font-size:12px;line-height:1.5}
.ag-note:focus{outline:none;border-color:var(--accent2);background:var(--card)}
.ag-note::placeholder{color:var(--faint)}
/* rychlý zápis za hovoru — tenké, tiché pole rovnou na kartičce */
.ag-note.quick{min-height:0;margin-top:7px;padding:5px 9px;background:none;border-color:var(--line2)}
.ag-note.quick:placeholder-shown{color:var(--mut)}
.ag-note.quick:not(:placeholder-shown){background:var(--well);border-color:var(--line)}

.notec{padding:10px 12px 11px}
.nc-h{display:flex;align-items:center;gap:7px}
.nc-n{font-size:12.5px;font-weight:650;flex:1;line-height:1.3}
.nc-f{font-size:11px;color:var(--mut);margin:2px 0 7px;padding-left:23px}
.nc-w{color:var(--faint)}
.notec .ag-note{margin-top:0;min-height:58px;font-size:12.5px}
.tickbox{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px;font-weight:600;
         color:var(--ink);background:none;border:none;padding:2px 0;margin:0}
.tickbox:hover{color:var(--ok)}
.tickbox input{width:16px;height:16px;margin:0;accent-color:var(--ok);cursor:pointer}
.colempty{padding:14px 16px;color:var(--faint);font-size:12px;font-style:italic}

.locked .col:not(.col-toc) .card:not(.iskill){opacity:.45;pointer-events:none}

/* ============ hover panel ============ */
#pop{position:fixed;z-index:80;width:330px;background:var(--card);border:1px solid var(--line);
     border-radius:10px;box-shadow:var(--shadow2);display:none}
#pop.show{display:block}
#pop .pop-h{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line2)}
#pop .pop-t{font-weight:650;font-size:12.5px;flex:1}
#pop .pop-b{padding:9px 13px;font-size:12px;color:var(--ink);line-height:1.55}
#pop .pop-b em{color:var(--mut);font-style:italic}
#pop .pop-tags{display:flex;flex-direction:column;gap:4px;padding:8px 13px;border-top:1px solid var(--line2);

#pop .pop-rel{padding:8px 13px;font-size:11.5px;display:flex;flex-direction:column;gap:5px}
#pop .pop-rel .pr{display:flex;gap:12px;align-items:baseline}
#pop .pop-rel .pr span{color:var(--mut);flex:none;min-width:96px}
#pop .pop-rel .pr b{color:var(--ink);font-weight:600}
#pop::before{content:"";position:absolute;left:-6px;top:var(--ay,18px);width:10px;height:10px;

     transform:rotate(45deg)}
#pop.left::before{left:auto;right:-6px;transform:rotate(225deg)}

/* ═══════════════ STATE ═══════════════ */
const S={
  sel:{},        /* id -> index volby */
  agenda:{},     /* id -> 1  (navěšeno na hovor) */
  note:{},       /* id -> poznámka k bodu agendy */
  stFilter:null, /* filtr podle typu stavu (z Obsahu) */
  rtab:'agenda', /* pravý sloupec: agenda / poznámky */
  ticked:{},     /* id -> 1  (odbaveno v hovoru) */
  edit:{},       /* id -> rozbalený picker */
  filter:'vse',  /* vse | open | agenda */
  group:'stav',  /* stav | tema | kat */
  notes:'',
  area:null,
  sim:{mimoEU:true, pojisteno:false, clo:true, pref:true}
};

/* ═══════════════ ODVOZENÉ ═══════════════ */
const ITEMS=[];
AREAS.forEach(a=>a.groups.forEach(g=>g.items.forEach(it=>{
  it.area=a.name; it.areaId=a.id; it.conds=[a.cond,it.cond].filter(Boolean);
  ITEMS.push(it);
})));
/* „Čeká na zákazníka" je volba u každé položky — rozhodnutí padlo, ale čeká se na úkon
   zákazníka. Nikdy to není konečný stav a vždycky to drží položku na agendě hovoru. */
ITEMS.forEach(it=>it.o.push(['Čeká se na zákazníka','cek',
  'Domluveno, ale čeká se, až zákazník něco udělá — potvrdí, doloží doklad, opraví údaj. Až to dorazí, vybereme výsledný stav.',[]]));
RANK.cek=3;
const BY=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const CONDN={mimoEU:'mimo EU',clo:'plnohodnotné clení',pref:'preferenční dohoda',pojisteno:'pojištěno'};
/* stavy, které samy o sobě patří na hovor */
const CALLST=['zji','res','inf','pot','zme'];

const vis   = it => it.conds.every(c=>S.sim[c]);
/* „v jakém je položka stavu“ — pro počty i pro filtr v Obsahu.
   cek není volitelný stav, ale odvozená pozice, tak se počítá podle ní. */
const inState = (it,k) => k==='none' ? !stOf(it.id) : stOf(it.id)===k;

/* filtr 2. sloupce — používá ho i Obsah, aby se prázdné oblasti schovaly zároveň */
const passFilter = it => {
  const ph=phase(it.id);
  if(S.stFilter && !inState(it,S.stFilter)) return false;
  if(S.filter==='open')   return ph!=='done';
  if(S.filter==='agenda') return ph==='call'||ph==='wait';
  return true;
};
const live  = () => ITEMS.filter(vis);
const stOf  = id => S.sel[id]===undefined ? null : BY[id].o[S.sel[id]][1];
const optOf = id => S.sel[id]===undefined ? null : BY[id].o[S.sel[id]];

/* stav položky ve 2. sloupci */
function phase(id){
  const s=stOf(id);
  if(!s) return 'todo';                    /* nevyhodnoceno */
  if(s==='cek') return 'wait';             /* čekání není konečné — nejde ho ani odškrtnout */
  if(S.ticked[id]) return 'done';          /* vyřešeno v hovoru */
  if(S.agenda[id]) return 'call';          /* na agendě — i „v pořádku“, když ji tam operátor dá sám */
  if(s==='ok'||s==='rus') return 'done';   /* konečné, hovor nepotřebuje */
  return 'loose';                          /* vyhodnoceno, ale nikde se neřeší */
}
const onAgenda = id => ['call','wait'].includes(phase(id));

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const stlab=(s,past)=>`<span class="st"><span class="sic sic-${s}">${ST[s].ic}</span>${past?ST[s].n2:ST[s].n}</span>`;
const sic=s=>`<span class="sic sic-${s}">${ST[s].ic}</span>`;
const ordered=it=>it.o.map((op,i)=>[i,op]).sort((a,b)=>RANK[a[1][1]]-RANK[b[1][1]] || a[0]-b[0]);
/* ⚠ ZNAČKY RIZIK (💰 cena · 📄 doklad · ⏱ zdržení · 🚫 zastavení · ✏️ oprava dat) JSOU DOČASNĚ SKRYTÉ.
   Data u voleb zůstávají v poli TAGS a ve čtvrtém prvku každé volby — až se klient rozhodne
   (otázka 13 v analýze), stačí přepnout TAGS_ON na true a vrátit volbu „podle rizika“ v agendě. */
const TAGS_ON=false;
const tagchip=t=>TAGS_ON?`<span title="${TAGS[t][1]}">${TAGS[t][0]}</span>`:'';

/* ═══════════════ RENDER ═══════════════ */
const board=document.getElementById('board');

function render(){
  const L=live();
  const anyRed=L.some(i=>stOf(i.id)==='rus');
  document.body.classList.toggle('locked',anyRed);
  document.getElementById('ban').classList.toggle('on',anyRed);

  const agenda =L.filter(i=>onAgenda(i.id));
  /* jeden pruh přes všechny položky — každá je právě v jedné z pěti pozic */
  const P={todo:0,call:0,wait:0,loose:0,done:0};
  L.forEach(i=>P[phase(i.id)]++);
  const N=L.length, closed=P.done, pct=n=>N?n/N*100:0;
  const seg=(k,cls)=>P[k]?`<i class="${cls}" style="width:${pct(P[k])}%"></i>`:'';
  const lg=(k,cls,label)=>`<span class="lg ${cls} ${P[k]?'':'zero'}"><b>${P[k]}</b> ${label}</span>`;
  document.getElementById('sum').innerHTML=
    `<div class="sumbar">${seg('done','sg-done')}${seg('call','sg-call')}${seg('wait','sg-wait')}${seg('loose','sg-loose')}</div>
     <div class="sumleg">${lg('todo','lg-todo','k posouzení')}${lg('call','lg-call','na hovoru')}
       ${P.wait?lg('wait','lg-wait','čeká na zákazníka'):''}${P.loose?lg('loose','lg-loose','bez agendy'):''}
       ${lg('done','lg-done',`hotovo <span class="tot">z ${N}</span>`)}</div>`;

  const g=document.getElementById('gstat'); const sts=L.map(i=>stOf(i.id)); let k,txt,sub='';
  if(sts.includes('rus')){k='rus';txt='Zásilka se ruší';}
  else if(sts.includes(null)){k='zji';txt='Vyhodnocuje se';sub=`zbývá ${sts.filter(s=>!s).length}`;}
  else if(closed<L.length){k='pot';txt='K odbavení v hovoru';sub=`${L.length-closed} položek`;}
  else if(sts.includes('inf')||sts.includes('pot')||sts.includes('zme')){k='ok';txt='Posílá se s nálezy';}
  else {k='ok';txt='Posílá se v pořádku';}
  g.className='gstat g-'+k;
  g.innerHTML=`${sic(k)}${esc(txt)}${sub?` <span class="gsub">· ${esc(sub)}</span>`:''}`;

  /* zachovat scroll ve sloupcích */
  const keep={};
  document.querySelectorAll('.col-b[id]').forEach(n=>keep[n.id]=n.scrollTop);
  board.innerHTML = colToc(L) + colItems(L) + colCall(L,agenda);
  Object.entries(keep).forEach(([id,v])=>{const n=document.getElementById(id); if(n) n.scrollTop=v;});
  autogrowAll();
  measure();
}

/* ---------- 1. sloupec: OBSAH ---------- */
function colToc(L){
  let hidden=0;
  const rows=AREAS.map(a=>{
    const shown=!a.cond||S.sim[a.cond];
    const items=a.groups.flatMap(g=>g.items).filter(vis);
    const filtered=S.stFilter||S.filter!=='vse';
    /* oblast skrytá podmínkou zásilky — dává smysl jen když nic nefiltruje */
    if(!shown) return filtered ? '' : `<a class="toc-a off"><div class="toc-r1"><span class="toc-nm">${esc(a.name)}</span>
        <span class="toc-cond">skryto</span></div>
        <div class="toc-dots" style="font-size:10px;color:var(--faint)">podmínka: ${esc(CONDN[a.cond]||a.cond)}</div></a>`;
    /* oblast, ve které filtru nic nevyhovuje, z obsahu zmizí — sloupec vedle je taky prázdný */
    const hits=items.filter(passFilter);
    if(!hits.length){ hidden++; return ''; }
    /* při filtru počítá i tečkuje jen to, co filtru vyhovuje — obsah pak sedí na to, co je vedle vidět */
    const dec=items.filter(i=>stOf(i.id)).length;
    const dots=items.map(i=>{
      const s=stOf(i.id), off=filtered&&!hits.includes(i);
      return s?`<span class="dot s-${s} ${off?'off':''}" style="background:var(--sc)" title="${esc(i.n)} — ${esc(ST[s].n)}"></span>`
              :`<span class="dot none ${off?'off':''}" title="${esc(i.n)} — nevyhodnoceno"></span>`;
    }).join('');
    return `<a class="toc-a ${S.area===a.id?'on':''}" data-nav="${a.id}">
      <div class="toc-r1"><span class="toc-nm">${esc(a.name)}</span>
        <span class="toc-n">${filtered?`${hits.length} z ${items.length}`:`${dec}/${items.length}`}</span></div>
      <div class="toc-dots">${dots}</div></a>`;
  }).join('');

  /* stavy fungují jako filtr — s počtem, kolik položek v něm právě je */
  const legRow=(k,label,icon)=>{
    const n=L.filter(i=>inState(i,k)).length, on=S.stFilter===k;
    return `<button class="leg-r ${on?'on':''} ${n?'':'zero'}" data-st="${k}"
      title="${n?(on?'zrušit filtr':'ukázat jen tyhle položky'):'žádná položka v tomhle stavu'}">
      ${icon||sic(k)}<b>${esc(label)}</b><span class="n">${n}</span></button>`;
  };
  const legend=legRow('none','Nevyhodnoceno','<span class="dot none"></span>')
    +Object.entries(ST).map(([k,v])=>legRow(k,v.n)).join('');
  const flt={vse:'',open:'jen nevyřešené',agenda:'jen na agendě'}[S.filter];

  return `<div class="col col-toc">
    <div class="col-h">
      <div class="ch-top"><span class="ch-t">Obsah</span><span class="ch-n"><em>${L.length} položek</em></span></div>
      ${flt?`<div class="ch-sub">${flt} — podle filtru vpravo</div>`:''}
    </div>
    <div class="col-b" id="cbToc"><div class="toc">${rows||'<div class="colempty">Filtru nevyhovuje žádná oblast.</div>'}
      ${hidden?`<div class="toc-hid">${hidden===1?'1 oblast skrytá':hidden<5?hidden+' oblasti skryté':hidden+' oblastí skryto'} filtrem</div>`:''}
      <div class="toc-h">Typy stavů</div>
      <div class="legend">${legend}</div>
    </div></div></div>`;
}

/* ---------- volby ---------- */
function optsHTML(it,selIdx,past){
  let rows='',last=null;
  ordered(it).forEach(([i,op])=>{
    if(past && op[1]==='zji') return;   /* po hovoru „nevíme“ není platný výsledek */
    const r=RANK[op[1]];
    if(last!==null && r!==last) rows+='<div class="osep"></div>';
    last=r;
    rows+=`<button class="orow s-${op[1]} ${selIdx===i?'sel':''}" data-opt="${it.id}:${i}" data-pop="${it.id}:${i}">
        <span class="rd"></span><span class="txt">${esc(op[0])}</span>
        <span class="tg">${op[3].map(tagchip).join('')}</span>${stlab(op[1],past)}
        <span class="info" title="popis volby">i</span></button>`;
  });
  return `<div class="opts">${rows}</div>`;
}

/* ---------- 2. sloupec: VŠECHNY POLOŽKY ---------- */
function itemCard(it){
  const ph=phase(it.id), st=stOf(it.id), editing=S.edit[it.id];
  /* žádný plovoucí kontext — ten je vidět v pruhu nad oblastí a najetím se v něm rozsvítí
     přesně ty údaje, kterých se položka týká (data-rel) */
  const attrs=`data-twin="${it.id}" data-rel="${(it.rel||[]).join('|')}"`;

  /* ── nevyhodnoceno (nebo rozbaleno ke změně) = plná karta s volbami ── */
  if(ph==='todo'||editing){
    const bar=editing?`<div class="cardbar"><button class="lnk" data-edit="${it.id}">zpět</button></div>`:'';
    return `<div class="card ${st==='rus'?'iskill':''}" ${attrs}>
      <div class="hd">
        <span class="nm">${esc(it.n)}</span>
        ${it.conds.length?`<span class="cnd">jen když: ${it.conds.map(c=>esc(CONDN[c]||c)).join(' + ')}</span>`:''}
        ${it.warn?`<span class="flag" title="${esc(it.warn)}">⚠ k vyjasnění</span>`:''}</div>
      ${it.d?`<p class="dsc">${esc(it.d)}</p>`:''}
      ${optsHTML(it,S.sel[it.id],false)}
      ${bar}</div>`;
  }

  /* ── rozhodnuto = jeden řádek. Výplň říká, kde položka je; ikona, v jakém je stavu. ── */
  const i=S.sel[it.id], op=it.o[i];
  /* meta stojí vedle řádku, ne uvnitř — aby z něj mohlo být i tlačítko */
  const row=(cls,meta,acts,extra)=>`<div class="card ${cls} ${st==='rus'?'iskill':''}" ${attrs}>
      <div class="rowwrap">
        <button class="donerow" data-edit="${it.id}" title="klik = rozbalit a změnit volbu">
          ${sic(st)}<span class="dn">${esc(it.n)}</span><span class="dv">${esc(op[0])}</span>
          <span class="tg">${op[3].map(tagchip).join('')}</span></button>${meta}</div>
      ${extra||''}
      <div class="doneact"><button class="lnk" data-edit="${it.id}">změnit volbu</button>${acts}</div></div>`;

  const vAgende=`<button class="lnk" data-go="${it.id}">ukázat v agendě →</button>`;
  const odebrat=`<button class="lnk" data-drop="${it.id}">odebrat z agendy</button>`;

  if(ph==='call'){
    /* tam, kde je v agendě jen checkbox, je i tady tlačítko se stejným účinkem;
       u „Zjistit“ a „Vyřešit“ se musí zaznamenat výsledek, takže jen popisek */
    const tick={pot:'Potvrdit',zme:'Potvrdit',inf:'Informován'}[st];
    const meta=tick
      ? `<button class="mini rowact" data-tick="${it.id}"
           title="uzavře položku v tomhle stavu — stejné jako odkliknutí v agendě">✓ ${tick}</button>`
      : `<span class="dm ag">📞 ${esc(ZONE_OF[st])}</span>`;
    return row('onag',meta,vAgende+odebrat);
  }

  if(ph==='wait')
    return row('onag',`<span class="dm ag">⏳ Čeká na zákazníka</span>`,vAgende);

  if(ph==='loose') /* rozhodnuto, ale nikde se to neřeší — jediný řádek, který volá po akci */
    return row('orphaned',`<span class="dm warn">neřeší se nikde</span>`,
      `<button class="lnk" data-add="${it.id}">+ na agendu hovoru</button>`);

  /* hotovo je vždycky zelené, ať se uzavřelo jakkoli — jediná výjimka je zrušená zásilka.
     Stav si nese ikona vlevo, plocha říká jen „tohle už je za mnou“.
     Poznámku lze psát jen sem — u uzavřené položky je to záznam, ne pracovní lístek. */
  return row(`done ${st==='rus'?'s-rus':'s-ok'}`,
    S.ticked[it.id]?`<span class="dm">vyřešeno v hovoru</span>`:'',
    S.ticked[it.id]?`<button class="lnk" data-go="${it.id}">ukázat v agendě →</button>`
                   :`<button class="lnk" data-add="${it.id}">+ zmínit v hovoru</button>`,
    /* poznámka z hovoru se sem propíše jako záznam — psát se dá jen v agendě */
    S.note[it.id]?`<div class="donenote">${esc(S.note[it.id])}</div>`:'');
}

function colItems(L){
  const todo=L.filter(i=>phase(i.id)==='todo').length;
  const pass=passFilter;
  const inner=AREAS.filter(a=>!a.cond||S.sim[a.cond]).map(a=>{
    const all=a.groups.flatMap(g=>g.items).filter(vis);
    const shown=all.filter(pass);
    if(!shown.length) return '';
    const dec=all.filter(i=>stOf(i.id)).length;
    return `<div class="area" id="ar-${a.id}" data-area="${a.id}">
      <div class="area-h">
        <div class="area-t"><h2>${esc(a.name)}</h2><span class="pr">vyhodnoceno ${dec} z ${all.length}</span></div>
        <div class="ctxbox">${a.ctx.map(([k,v])=>`<span class="kv" data-k="${esc(k)}">${esc(k)}: <b>${esc(v)}</b></span>`).join('')}</div>
      </div>
      ${a.groups.map(g=>{
        const gi=g.items.filter(it=>vis(it)&&pass(it)); if(!gi.length) return '';
        return (g.n?`<div class="grp">${esc(g.n)}</div>`:'')+`<div class="cards">${gi.map(itemCard).join('')}</div>`;
      }).join('')}
    </div>`;
  }).join('');
  const seg=(v,l)=>`<button data-filter="${v}" class="${S.filter===v?'on':''}">${l}</button>`;
  return `<div class="col col-items">
    <div class="col-h">
      <div class="ch-top"><span class="ch-t">Položky checklistu</span>
        <span class="ch-n">${todo}<em> k posouzení</em></span></div>
      <div class="ch-row"><span class="segs">${seg('vse','vše')}${seg('open','nevyřešené')}${seg('agenda','na agendě')}</span>
        ${S.stFilter
          ? `<button class="stchip" data-st="${S.stFilter}">${S.stFilter==='none'?'<span class="dot none"></span>':sic(S.stFilter)}
               ${esc(S.stFilter==='none'?'Nevyhodnoceno':ST[S.stFilter].n)} <span class="x">✕</span></button>
             <span class="ch-sub">filtr ze sloupce Obsah</span>`
          : `<span class="ch-sub">vyhodnocené i navěšené na hovor tu zůstávají, nic se neodstěhuje</span>`}</div>
    </div>
    <div class="col-b" id="cbItems">${inner||'<div class="colempty">Filtr nic nenašel.</div>'}</div></div>`;
}

/* ---------- 3. sloupec: AGENDA HOVORU ---------- */
const ZONE_OF={zji:'Zjistit',res:'Vyřešit',inf:'Informovat',pot:'Potvrdit',zme:'Potvrdit',
               ok:'Jen zmínit',rus:'Jen zmínit'};

function agCard(it){
  const st=stOf(it.id), i=S.sel[it.id], op=it.o[i], ph=phase(it.id), editing=S.edit['ag_'+it.id];
  const head=`<div class="ag-h"><span class="ag-nm">${esc(it.n)}</span>
      <button class="lnk" data-go2="${it.id}">v checklistu ↑</button></div>
    <div class="ag-find">${sic(st)}<span><b>${esc(op[0])}</b></span></div>`;
  /* zápis za hovoru musí být na jeden klik — pole je rovnou tady, jen tenké a tiché */
  const noteBox=`<textarea class="ag-note quick" data-note="${it.id}" rows="1"
      placeholder="Poznámka…">${esc(S.note[it.id]||'')}</textarea>`;

  /* volbu jde přepsat u každého bodu agendy — odsud jde výsledek rovnou mezi vyřešené,
     což v checklistu udělat nejde */
  if(editing)
    return `<div class="card ag" data-twin="${it.id}" data-relpop="${it.id}">${head}${noteBox}
      ${optsHTML(it,i,true)}
      <div class="cardbar"><button class="lnk" data-agedit="${it.id}">zpět</button></div></div>`;

  if(ph==='done')
    return `<div class="card done s-${st}" data-twin="${it.id}" data-relpop="${it.id}">
      <button class="donerow" data-go2="${it.id}" title="klik = ukázat v checklistu">
        ${sic(st)}<span class="dn">${esc(it.n)}</span><span class="dv">${esc(op[0])}</span>
        <span class="dm">✓ vyřešeno</span></button>
      ${S.note[it.id]?`<div class="donenote">${esc(S.note[it.id])}</div>`:''}
      <div class="doneact"><button class="lnk" data-agedit="${it.id}">změnit volbu</button>
        <button class="lnk" data-untick="${it.id}">vrátit na agendu</button></div></div>`;

  /* dočasné stavy se odklikat nedají — musí se zapsat výsledek */
  const primary=(st==='zji'||st==='res'||st==='cek')
    ? `<button class="mini" data-agedit="${it.id}">Zapsat výsledek</button>`
    : '';
  let tick='';
  if(st==='inf')                  tick='Informován';
  else if(st==='pot'||st==='zme') tick='Potvrzeno';
  else if(st==='ok'||st==='rus')  tick='Zmíněno';

  return `<div class="card ag" data-twin="${it.id}" data-relpop="${it.id}">${head}${noteBox}
    <div class="cardbar">
      ${tick?`<label class="tickbox"><input type="checkbox" data-tick="${it.id}"> ${tick}</label>`:primary}
      <button class="lnk right" data-agedit="${it.id}">změnit volbu</button></div></div>`;
}

function colCall(L,agenda){
  const waits=L.filter(i=>phase(i.id)==='wait');
  const open =agenda.filter(i=>phase(i.id)==='call');
  const done =L.filter(i=>phase(i.id)==='done'&&S.ticked[i.id]);

  let zones;
  if(S.group==='stav'){
    zones=[['zji','Zjistit',i=>stOf(i.id)==='zji'],
           ['res','Vyřešit',i=>stOf(i.id)==='res'],
           ['inf','Informovat',i=>stOf(i.id)==='inf'],
           ['pot','Potvrdit',i=>['pot','zme'].includes(stOf(i.id))],
           ['ok','Jen zmínit',i=>['ok','rus'].includes(stOf(i.id))]]
      .map(([k,label,f])=>({tint:k,k,label,items:open.filter(f)})).filter(z=>z.items.length);
  }else if(S.group==='tema'){
    const order=['cena','dok','cas','stop','data'];
    zones=order.map(t=>({k:null,label:TAGS[t][0]+' '+TAGS[t][1],
      items:open.filter(i=>(optOf(i.id)[3][0]||null)===t)}));
    zones.push({k:null,label:'Bez rizika',items:open.filter(i=>!optOf(i.id)[3].length)});
    zones=zones.filter(z=>z.items.length);
  }else{
    zones=AREAS.map(a=>({k:null,label:a.name,items:open.filter(i=>i.areaId===a.id)})).filter(z=>z.items.length);
  }

  const seg=(v,l)=>`<button data-grp="${v}" class="${S.group===v?'on':''}">${l}</button>`;
  const body=[
    zones.map(z=>`<div class="zone ${z.tint?'tint zt-'+z.tint:''}">
        <div class="zone-h">${z.k?sic(z.k):''} ${esc(z.label)} <span class="c">${z.items.length}</span></div>
        <div class="cards">${z.items.map(agCard).join('')}</div></div>`).join(''),
    waits.length?`<div class="zone tint zt-cek"><div class="zone-h">${sic('cek')} Čeká se na zákazníka
        <span class="c">${waits.length}</span></div>
        <div class="cards">${waits.map(agCard).join('')}</div></div>`:'',
    done.length?`<div class="zone"><div class="zone-h">✓ Vyřešeno v hovoru <span class="c">${done.length}</span></div>
        <div class="cards">${done.map(agCard).join('')}</div></div>`:''
  ].join('');

  const withNote=L.filter(i=>S.note[i.id]).length;
  const tab=(v,l)=>`<button data-rtab="${v}" class="${S.rtab===v?'on':''}">${l}</button>`;
  const isNotes=S.rtab==='notes';

  return `<div class="col col-call">
    <div class="col-h">
      <div class="ch-top"><span class="ch-t">Hovor</span>
        <span class="ch-n">${isNotes?withNote:open.length}<em>${isNotes?' poznámek':' k probrání'}</em></span></div>
      <div class="ch-row">
        <span class="segs">${tab('agenda','agenda')}${tab('notes',`poznámky${withNote?' · '+withNote:''}`)}</span>
        ${isNotes?'':`<span class="segs">${seg('stav','stav')}${TAGS_ON?seg('tema','riziko'):''}${seg('kat','oblast')}</span>`}
      </div>
    </div>
    <div class="callhead"><span class="ci">📞</span>
      <div><b>Hovor se zákazníkem — zítra 10:00</b>
        <div style="font-size:11px;color:var(--mut)">Jan Novák · +420 777 123 456 · ${open.length} bodů k probrání</div></div>
      <button class="lnk">přeplánovat</button></div>
    <div class="col-b" id="cbCall">${isNotes?notesView(L)
      :(body||'<div class="colempty">Zatím nic k hovoru. Jakmile u položky vybereš volbu, která potřebuje zákazníka, objeví se tu jako bod agendy.</div>')}</div></div>`;
}

/* ---------- 3. sloupec, záložka POZNÁMKY ----------
   Všechno, co jsem si za hovoru zapsal, na jedné obrazovce — a u každé poznámky
   je vidět, ke které položce patří a co u ní bylo rozhodnuto. */
function notesView(L){
  const items=L.filter(i=>S.note[i.id]);
  const blocks=AREAS.map(a=>{
    const its=items.filter(i=>i.areaId===a.id);
    if(!its.length) return '';
    return `<div class="zone"><div class="zone-h">${esc(a.name)} <span class="c">${its.length}</span></div>
      <div class="cards">${its.map(noteCard).join('')}</div></div>`;
  }).join('');
  return `<div class="zone"><div class="zone-h">Obecně k zásilce</div>
      <div class="cards"><textarea class="ag-note" id="notesArea"
        placeholder="Co zaznělo, na co nezapomenout…">${esc(S.notes)}</textarea></div></div>
    ${blocks||`<div class="colempty">Zatím sis nic nezapsal. Poznámku napíšeš přímo do kartičky v agendě —
      objeví se tu i s tím, ke které položce patří.</div>`}`;
}
function noteCard(it){
  const st=stOf(it.id), op=optOf(it.id), ph=phase(it.id);
  const kde={call:'na agendě',wait:'čeká na zákazníka',done:'vyřešeno',loose:'mimo agendu',todo:''}[ph];
  return `<div class="card notec">
    <div class="nc-h">${sic(st)}<span class="nc-n">${esc(it.n)}</span>
      <button class="lnk" data-go2="${it.id}">v checklistu ↑</button></div>
    <div class="nc-f">${esc(op[0])}${kde?` <span class="nc-w">· ${kde}</span>`:''}</div>
    <textarea class="ag-note" data-note="${it.id}">${esc(S.note[it.id])}</textarea></div>`;
}

/* ═══════════════ HOVER PANEL ═══════════════ */
const pop=document.getElementById('pop');
let popKey=null, hideT=null;
function showPop(el){
  const [id,ix]=el.dataset.pop.split(':');
  const it=BY[id]; if(!it||!it.o[+ix]) return;
  const op=it.o[+ix];
  if(popKey===el.dataset.pop && pop.classList.contains('show')) return;
  popKey=el.dataset.pop;
  pop.innerHTML=`<div class="pop-h">${stlab(op[1])}<span class="pop-t">${esc(op[0])}</span></div>
    <div class="pop-b">${op[2]?esc(op[2]):'<em>Bez doplňujícího popisu — volba je samovysvětlující.</em>'}</div>
    ${TAGS_ON&&op[3].length?`<div class="pop-tags">${op[3].map(t=>`<span>${TAGS[t][0]} ${esc(TAGS[t][1])}</span>`).join('')}</div>`:''}`;
  placePop(el);
}
/* kontext zásilky k položce — jen ta pole, podle kterých se rozhoduje */
function showRelPop(el){
  const it=BY[el.dataset.relpop]; if(!it) return;
  const key='rel:'+it.id;
  if(popKey===key && pop.classList.contains('show')) return;
  const a=AREAS.find(x=>x.id===it.areaId);
  const rows=(it.rel||[]).map(k=>{const kv=a&&a.ctx.find(c=>c[0]===k);
    return kv?`<div class="pr"><span>${esc(kv[0])}</span><b>${esc(kv[1])}</b></div>`:'';}).filter(Boolean).join('');
  if(!rows) return;
  popKey=key;
  pop.innerHTML=`<div class="pop-h"><span class="pop-t">${esc(it.n)}</span></div>
    <div class="pop-rel">${rows}</div>`;
  placePop(el);
}
function placePop(el){
  pop.classList.add('show'); pop.classList.remove('left');
  const r=el.getBoundingClientRect();
  pop.style.top='0px'; pop.style.left='0px';
  const pw=pop.offsetWidth, ph=pop.offsetHeight;
  let x=r.right+12, y=r.top+r.height/2-18;
  if(x+pw>innerWidth-8){ x=r.left-pw-12; pop.classList.add('left'); }
  if(y+ph>innerHeight-8) y=innerHeight-ph-8;
  if(y<58) y=58;
  pop.style.left=x+'px'; pop.style.top=y+'px';
  pop.style.setProperty('--ay',Math.max(10,Math.min(ph-20,r.top+r.height/2-y-5))+'px');
}
function hidePop(){ pop.classList.remove('show'); popKey=null; }

/* dvojče: zvýraznit tutéž položku v obou sloupcích */
document.addEventListener('mouseover',e=>{
  const el=e.target.closest('[data-pop]'), rp=e.target.closest('[data-relpop]');
  if(el){ clearTimeout(hideT); showPop(el); }
  else if(rp){ clearTimeout(hideT); showRelPop(rp); }
  else if(!e.target.closest('#pop')){ hideT=setTimeout(hidePop,120); }
  const row=e.target.closest('[data-rel]');
  if(row){
    const rel=row.dataset.rel?row.dataset.rel.split('|'):[];
    row.closest('.col-b')?.querySelectorAll('.kv').forEach(k=>k.classList.toggle('hi',rel.includes(k.dataset.k)));
  }
});
addEventListener('scroll',hidePop,{passive:true,capture:true});

/* ═══════════════ EVENTS ═══════════════ */
function scrollTo(col,el){ if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); }

document.addEventListener('click',e=>{
  const C=s=>e.target.closest(s); let el;

  if(el=C('[data-opt]')){
    const [id,i]=el.dataset.opt.split(':');
    /* výsledek zapsaný z agendy = hovor už proběhl → položka jde rovnou mezi vyřešené */
    const afterCall=!!S.edit['ag_'+id];
    S.sel[id]=+i;
    delete S.edit[id]; delete S.edit['ag_'+id];
    const st=BY[id].o[+i][1];
    /* čekání na zákazníka drží položku na agendě a nikdy ji neuzavře */
    if(st==='cek'){ S.agenda[id]=1; delete S.ticked[id]; }
    /* zapsáno z agendy = hovor proběhl → ať je výsledek jakýkoli, patří mezi vyřešené v hovoru */
    else if(afterCall){ S.agenda[id]=1; S.ticked[id]=1; }
    else if(st==='ok'||st==='rus'){ delete S.agenda[id]; delete S.ticked[id]; }
    else { S.agenda[id]=1; delete S.ticked[id]; }
    hidePop(); return render();
  }
  if(el=C('[data-agedit]')){ const id=el.dataset.agedit; S.edit['ag_'+id]=!S.edit['ag_'+id]; hidePop(); return render(); }
  if(el=C('[data-edit]')){ const id=el.dataset.edit; S.edit[id]=!S.edit[id]; hidePop(); return render(); }
  if(el=C('[data-add]')){ S.agenda[el.dataset.add]=1; return render(); }
  if(el=C('[data-drop]')){ delete S.agenda[el.dataset.drop]; return render(); }
  if(el=C('[data-tick]')){ const id=el.dataset.tick; S.ticked[id]=1; return render(); }
  if(el=C('[data-untick]')){ const id=el.dataset.untick; delete S.ticked[id]; S.agenda[id]=1; return render(); }
  if(el=C('[data-st]')){ const k=el.dataset.st;
    if(el.classList.contains('zero')) return;
    S.stFilter=S.stFilter===k?null:k; return render(); }
  if(el=C('[data-filter]')){ S.filter=el.dataset.filter; return render(); }
  if(el=C('[data-rtab]')){ S.rtab=el.dataset.rtab; return render(); }
  if(el=C('[data-grp]')){ S.group=el.dataset.grp; return render(); }
  if(el=C('[data-nav]')){ S.area=el.dataset.nav;
    document.getElementById('ar-'+el.dataset.nav)?.scrollIntoView({behavior:'smooth',block:'start'});
    document.querySelectorAll('.toc-a').forEach(n=>n.classList.toggle('on',n.dataset.nav===S.area)); return; }
  if(el=C('[data-go]')){ scrollTo('cbCall',document.querySelector(`#cbCall [data-twin="${el.dataset.go}"]`)); return; }
  if(el=C('[data-go2]')){ scrollTo('cbItems',document.querySelector(`#cbItems [data-twin="${el.dataset.go2}"]`)); return; }
});
/* psaní bez překreslení, ať operátor nepřijde o kurzor */
document.addEventListener('input',e=>{
  if(e.target.id==='notesArea') S.notes=e.target.value;
  else if(e.target.dataset.note) S.note[e.target.dataset.note]=e.target.value;
  if(e.target.classList.contains('ag-note')) autogrow(e.target);
});
/* pole na poznámku roste s obsahem — za hovoru se nechce scrollovat v okénku */
function autogrow(el){
  el.style.height='auto';
  /* scrollHeight nepočítá rámeček, ale border-box výška ano — jinak by text o 2 px přetékal */
  el.style.height=(el.scrollHeight+el.offsetHeight-el.clientHeight)+'px';
}
function autogrowAll(){ document.querySelectorAll('textarea.ag-note').forEach(autogrow); }
/* scroll-spy — obsah vlevo sleduje, kde jsi */
document.addEventListener('scroll',e=>{
  if(e.target.id!=='cbItems') return;
  const top=e.target.getBoundingClientRect().top+40;
  let cur=null;
  e.target.querySelectorAll('.area').forEach(a=>{ if(a.getBoundingClientRect().top<=top) cur=a.dataset.area; });
  if(cur&&cur!==S.area){ S.area=cur;
    document.querySelectorAll('.toc-a').forEach(n=>n.classList.toggle('on',n.dataset.nav===cur)); }
},true);

function measure(){
  const th=document.getElementById('tophdr').offsetHeight+
           (document.getElementById('ban').classList.contains('on')?document.getElementById('ban').offsetHeight:0);
  document.documentElement.style.setProperty('--th',th+'px');
}
addEventListener('resize',measure);

/* Checklist startuje prázdný — přesně tak, jak ho operátor otevře poprvé. */
render();
</script>
