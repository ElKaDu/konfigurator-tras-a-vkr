<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist zásilky — wireframe v3 (iterace 3, kanban)</title>
<style>
:root{
  --bg:#E2E3ED; --card:#fff; --ink:#403854; --mut:#837D96; --faint:#ADA8BC;
  --line:#E4E1EB; --line2:#EFEDF5; --well:#F5F5FA; --sep:#E7E6EF;
  --accent:#8C57FF; --shadow:0 1px 2px rgba(46,38,61,.06); --shadow2:0 8px 28px rgba(46,38,61,.18);
  --ok:#4CAF50; --zji:#9891A8; --res:#EA580C; --inf:#00A9BE; --pot:#F59E0B; --zme:#D9A400;
  --rus:#EF4444; --cek:#4C7EFF; --accent2:#A87FFF;
  --ok-bg:#eef7ee; --pot-bg:#fdf3e2; --rus-bg:#fdecec; --zji-bg:#f1effa;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#242038; --card:#2f2b45; --ink:#E7E3FC; --mut:#A49FBD; --faint:#736D8C;
  --line:#453F63; --line2:#3B3557; --well:#282443; --sep:#1E1B30;
  --accent:#A98BFF; --shadow:0 1px 2px rgba(0,0,0,.3); --shadow2:0 8px 28px rgba(0,0,0,.5);
  --ok-bg:#2b3a2c; --pot-bg:#41372a; --rus-bg:#432b2d; --zji-bg:#363152;
}}
:root[data-theme="dark"]{
  --bg:#242038; --card:#2f2b45; --ink:#E7E3FC; --mut:#A49FBD; --faint:#736D8C;
  --line:#453F63; --line2:#3B3557; --well:#282443; --sep:#1E1B30;
  --accent:#A98BFF; --shadow:0 1px 2px rgba(0,0,0,.3); --shadow2:0 8px 28px rgba(0,0,0,.5);
  --ok-bg:#2b3a2c; --pot-bg:#41372a; --rus-bg:#432b2d; --zji-bg:#363152;
}
:root[data-theme="light"]{
  --bg:#f2f3f8; --card:#fff; --ink:#2E263D; --mut:#7A748C; --faint:#A7A2B8;
  --line:#E4E1EB; --line2:#EFEDF5; --well:#F7F7FB; --sep:#E7E6EF;
  --accent:#8C57FF; --shadow:0 1px 2px rgba(46,38,61,.06); --shadow2:0 8px 28px rgba(46,38,61,.18);
  --ok-bg:#eef7ee; --pot-bg:#fdf3e2; --rus-bg:#fdecec; --zji-bg:#f1effa;
}
*{box-sizing:border-box}
html,body{height:100%}
/* svisle scrollují jednotlivé sloupce, vodorovně celá stránka — na užším displeji
   jde tak dojet na pravé sloupce místo toho, aby se uřízly */
body{margin:0;background:var(--bg);color:var(--ink);overflow-x:auto;overflow-y:hidden;
     font:14px/1.5 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;min-width:1600px}
button{font:inherit;color:inherit}

/* ═══ stavové tečky — jediný plošný nositel barvy ═══ */
.d{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
.d-ok{background:var(--ok)} .d-zji{background:transparent;border:1.5px dashed var(--mut);width:7px;height:7px}
.d-res{background:var(--res)} .d-inf{background:var(--inf)} .d-pot{background:var(--pot)}
.d-zme{background:var(--zme)} .d-rus{background:var(--rus)} .d-cek{background:var(--cek)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);font-weight:600;white-space:nowrap}
/* ikony stavů — nesou barvu, text zůstává šedý */
.sic{font-style:normal;font-weight:700;font-size:11px;width:15px;height:15px;flex:none;line-height:1;
     display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
     background:color-mix(in srgb,var(--sc,var(--faint)) 18%,transparent);color:var(--sc,var(--faint))}
/* šipky jsou tenké → větší stupeň a sytější podklad, ať jdou v 15px kroužku vidět */
.sic-zme{font-size:13px;font-weight:900;background:color-mix(in srgb,var(--sc) 30%,transparent)}
.sic-ok{--sc:var(--ok)} .sic-zji{--sc:var(--mut)} .sic-res{--sc:var(--res)} .sic-inf{--sc:var(--inf)}
.sic-pot{--sc:var(--pot)} .sic-zme{--sc:var(--zme)} .sic-rus{--sc:var(--rus)} .sic-cek{--sc:var(--cek)}

/* ============ top ============ */
.top{background:var(--card);border-bottom:1px solid var(--line);min-width:1600px}
.top-in{display:flex;align-items:center;gap:26px;padding:11px 24px 13px}
.tleft{flex:1;min-width:0}
.trow1{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.top h1{font-size:15px;margin:0;font-weight:650}
.top h1 span{color:var(--mut);font-weight:400}
.ship{color:var(--mut);font-size:12.5px}
.ship b{color:var(--ink);font-weight:600}
/* skládaný pruh: kolik je hotovo, kolik se čeká, kolik je na hovoru, zbytek = k posouzení */
.sbar{height:8px;border-radius:4px;background:var(--sep);overflow:hidden;display:flex;max-width:940px}
.sbar i{display:block;height:100%;transition:width .35s cubic-bezier(.4,0,.2,1)}
.slegend{display:flex;align-items:center;gap:18px;margin-top:8px;font-size:11.5px;color:var(--mut);flex-wrap:wrap}
.slegend .lg{display:inline-flex;align-items:center;gap:6px}
.slegend b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.slegend .ld{width:9px;height:9px;border-radius:50%;flex:none}
.slegend .tot{color:var(--faint)}
.gstat{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:650;font-size:13px;
       padding:5px 14px;border-radius:20px;border:1px solid var(--line)}
.gstat.g-ok{background:var(--ok-bg);border-color:transparent}
.gstat.g-pot{background:var(--pot-bg);border-color:transparent}
.gstat.g-rus{background:var(--rus-bg);border-color:transparent}
.gstat.g-zji{background:var(--well);border-color:transparent}
.gsub{font-weight:400;color:var(--mut);font-size:11.5px}
.simbar{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);padding:0 24px 8px}
.sw{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:14px;
    padding:2px 9px;cursor:pointer;background:none;font-size:11.5px;color:var(--mut)}
.sw.on{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.banner{display:none;background:var(--rus-bg);border-bottom:1px solid var(--rus);padding:8px 24px;
        font-weight:600;font-size:13px}
.banner.on{display:block}
.banner em{font-weight:400;color:var(--mut);font-style:normal}

/* ============ board — sloupce oddělené jen dividery ============ */
.board{display:grid;grid-template-columns:238px minmax(520px,1.4fr) minmax(370px,1fr) minmax(300px,.8fr);
       gap:18px;align-items:stretch;max-width:2200px;margin:0 auto;
       height:calc(100vh - var(--th,110px));overflow:hidden;padding:16px 20px 18px}
/* každý sloupec = samostatný bílý panel na šedém plátně → mezera je vidět */
.col{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;
     display:flex;flex-direction:column;min-height:0;max-height:100%}
/* hlavička sloupce — identitu nese tenká barevná linka před titulkem, ne plocha.
   Žádný vyplněný útvar, aby si to operátor nepletl s tlačítkem. */
.col{--cc:var(--accent)}
.col-call{--cc:var(--accent2)}
.col-wait{--cc:var(--cek)}
.col-done{--cc:var(--ok)}
.col-h{flex:none;padding:13px 18px 0;display:flex;flex-direction:column;gap:10px;
       background:var(--card);border-bottom:1px solid var(--line)}
/* min-height srovná hlavičky sloupců, i když jen některé mají přepínač */
.ch-top{display:flex;align-items:center;gap:11px;min-height:29px}
/* ── škála nadpisů ──
   Ú1 titulek sloupce · Ú2 kategorie/zóna · Ú3 podskupina · Ú4 drobenka na kartě
   Ú1–Ú2 verzálky + --ink (liší se jen velikostí), Ú3 větná velikost + šedá, ať se neplete */
.ch-t{font-weight:800;font-size:13.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink);
      display:inline-flex;align-items:center;gap:10px}
.ch-t::before{content:"";width:3px;height:16px;border-radius:2px;background:var(--cc);flex:none}
.ch-n{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;margin-left:auto;
      color:var(--cc)}
.ch-n em{font-style:normal;font-size:12px;font-weight:500;color:var(--mut);opacity:.7}
.ch-n.bump{animation:numpop .5s ease}
@keyframes numpop{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}
.ch-d{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;padding:1px 7px;border-radius:9px;
      animation:dpop 1.6s ease forwards}
.ch-d.up{color:var(--ok);background:var(--ok-bg)}
.ch-d.down{color:var(--mut);background:var(--well)}
@keyframes dpop{0%{opacity:0;transform:translateY(5px)}14%{opacity:1;transform:none}72%{opacity:1}100%{opacity:0}}
.ch-bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--cc) 18%,var(--card));
        overflow:hidden;margin-bottom:11px}
.ch-bar i{display:block;height:100%;border-radius:3px;background:var(--cc);
          transition:width .35s cubic-bezier(.4,0,.2,1)}
.col-h .segs{margin-left:0}
.col-b{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--well);padding:2px;gap:2px}
.segs button{background:none;border:none;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;color:var(--mut)}
.segs button:hover{color:var(--ink)}
.segs button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(64,56,84,.13)}
.stack{display:flex;flex-direction:column;gap:18px;min-height:0;max-height:100%}
.stack .col.waitp{flex:0 1 auto;max-height:42%}
.stack .col.donep{flex:1 1 auto}

/* ── přehledový sloupec: kategorie + tečka za každou položku ── */
.navrow{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
        padding:10px 16px;border-bottom:1px solid var(--line2)}
.navrow:hover{background:var(--well)}
/* kategorie, která už není v 1. sloupci — není kam skrolovat */
.navrow:disabled{cursor:default;opacity:.55}
.navrow:disabled:hover{background:none}
.navrow:disabled .nm{font-weight:600;color:var(--mut)}
.navrow .t{display:flex;align-items:baseline;gap:8px}
.navrow .nm{font-weight:650;font-size:12.5px;flex:1;line-height:1.35}
.navrow .c{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1.5px dashed var(--faint);background:none}
.dot.f{border:none}
.dot.s-ok{background:var(--ok)}   .dot.s-zji{background:var(--zji)}  .dot.s-res{background:var(--res)}
.dot.s-inf{background:var(--inf)} .dot.s-pot{background:var(--pot)}  .dot.s-zme{background:var(--zme)}
.dot.s-rus{background:var(--rus)} .dot.s-cek{background:var(--cek)}
.navfilt{flex:none;padding:9px 14px;border-bottom:1px solid var(--line)}
.navchk{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;padding:2px 0;
        cursor:pointer;font-size:11.5px;color:var(--mut);text-align:left}
.navchk:hover{color:var(--ink)}
.navchk .box{width:15px;height:15px;border:1.5px solid var(--line);border-radius:4px;flex:none;
             display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent}
.navchk.on .box{background:var(--accent);border-color:var(--accent);color:#fff}
.navchk.on{color:var(--ink);font-weight:600}
/* sbalený přehled */
.board.navclosed{grid-template-columns:46px minmax(520px,1.4fr) minmax(370px,1fr) minmax(300px,.8fr)}
.col-nav.closed{align-items:center;padding-top:13px;gap:14px}
.navtoggle{background:none;border:1px solid var(--line);border-radius:7px;width:28px;height:28px;
           cursor:pointer;color:var(--mut);font-size:13px;line-height:1;flex:none}
.navtoggle:hover{border-color:var(--accent);color:var(--accent)}
.vlabel{writing-mode:vertical-rl;text-orientation:mixed;font-size:11px;font-weight:800;
        text-transform:uppercase;letter-spacing:.14em;color:var(--faint)}
.col-h .navtoggle{margin-left:6px}

/* ── plánování hovoru — pruh přes celý sloupec, lícuje s kontextem kategorie vlevo ── */
.callplan{padding:14px 18px 12px;background:color-mix(in srgb,var(--accent) 9%,var(--card));
          border-bottom:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.callplan .cp-h{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink)}
.callplan .cp-s{font-size:11px;color:var(--mut);margin-top:8px}
.callplan .cp-s .when{color:var(--accent);font-weight:700;font-size:12.5px;text-transform:none;letter-spacing:0}
.callplan .cp-f{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.callplan input{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;
                padding:4px 7px;background:var(--card);color:var(--ink)}
.callplan input:focus{outline:none;border-color:var(--accent)}

/* ============ hierarchie 1. sloupce ============
   oblast (divider) → podskupina (label) → boxík položky → vnořený rámeček voleb   */
.area+.area{border-top:12px solid var(--sep)}
.zgroup+.zgroup{border-top:12px solid var(--sep)}
.area-h{position:sticky;top:0;z-index:8;background:var(--card)}
.area-t{display:flex;align-items:baseline;gap:10px;padding:15px 18px 8px}
.area-t h2{font-size:12.5px;margin:0;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink)}
.area-t .pr{color:var(--faint);font-size:11px;margin-left:auto;font-variant-numeric:tabular-nums}
/* kontext platí pro celou kategorii → táhne se přes celý sloupec, bez postranního odsazení */
.ctxbox{display:flex;flex-wrap:wrap;gap:2px 8px;padding:8px 18px;
        background:color-mix(in srgb,var(--accent) 9%,var(--card));
        border-bottom:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
        font-size:11px;color:var(--mut)}
.kv{padding:1px 6px;border-radius:5px;border:1px solid transparent}
.kv b{color:var(--ink);font-weight:600}
.kv.hi{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:var(--accent);color:var(--ink)}
/* Ú3 — podskupina: větná velikost a šedá, aby ji nešlo splést s kategorií */
.grp{padding:14px 18px 0;font-size:11.5px;text-transform:none;letter-spacing:0;color:var(--mut);font-weight:600}

/* ============ jednotná karta ============ */
.cards{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
/* boxík položky = šedý, vnořený boxík voleb = bílý → tři plochy: bílá / šedá / bílá */
.card{border:1px solid var(--line);border-radius:10px;padding:11px 13px 12px;background:var(--well);
      animation:slidein .2s ease}
@keyframes slidein{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.card .crumb{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:1px}
.card .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.card .nm{font-weight:650;font-size:12.5px;line-height:1.35}
.card .dsc{color:var(--mut);font-size:11.5px;margin:0 0 8px;max-width:80ch}
/* údaje zásilky — stejná fialová jako kontext kategorie v 1. sloupci */
.card .rel{font-size:10.5px;color:var(--mut);margin:10px 0 0;padding:6px 9px;line-height:1.55;
           background:color-mix(in srgb,var(--accent) 9%,var(--card));border-radius:6px}
.card .rel b{color:var(--ink);font-weight:600}
.flag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--pot-bg);
      border:1px solid var(--pot);cursor:help}
.cnd{font-size:10px;color:var(--faint);border:1px dashed var(--line);border-radius:5px;padding:1px 7px}
.autopill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--accent);
      border:1px dashed var(--accent);border-radius:12px;padding:1px 8px;margin-left:auto}

/* volby — vnořený rámeček v boxíku položky; barva jen v tečce */
.opts{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.orow{--sc:var(--faint);display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:var(--card);
      border:none;border-top:1px solid var(--line2);padding:6px 10px;cursor:pointer;position:relative}
.orow:first-child{border-top:none}
.orow:hover{background:color-mix(in srgb,var(--accent) 7%,var(--card))}
.orow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.orow .rd{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);flex:none;background:var(--card)}
.orow:hover .rd{border-color:var(--mut)}
.orow .txt{flex:1;font-size:12.5px;line-height:1.35}
.orow .tg{display:flex;gap:3px;flex:none;font-size:10.5px;opacity:.75}
.orow .st{width:118px;justify-content:flex-start}
.orow .info{flex:none;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);color:var(--mut);
      display:flex;align-items:center;justify-content:center;font-size:10px;font-style:italic;font-family:Georgia,serif;
      opacity:0;transition:opacity .12s}
.orow:hover .info{opacity:1}
.osep{height:1px;background:var(--line);margin:0}
.orow.prop{background:repeating-linear-gradient(135deg,transparent,transparent 7px,var(--well) 7px,var(--well) 14px)}
.orow.s-ok{--sc:var(--ok)} .orow.s-zji{--sc:var(--mut)} .orow.s-res{--sc:var(--res)}
.orow.s-inf{--sc:var(--inf)} .orow.s-pot{--sc:var(--pot)} .orow.s-zme{--sc:var(--zme)} .orow.s-rus{--sc:var(--rus)}
.orow.s-cek{--sc:var(--cek)}
.orow.sel{font-weight:600;box-shadow:inset 3px 0 0 var(--sc);background:color-mix(in srgb,var(--sc) 6%,var(--card))}
.orow.sel .rd{border:4.5px solid var(--sc)}
.orow.sel .st{color:var(--ink)}

.cardbar{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:11px;color:var(--mut);flex-wrap:wrap}
.cardbar.sub{margin-top:9px}
/* v Uzavřených je návrat výjimečná akce → ukáže se až při najetí na kartu */
.donep .card .cardbar{display:none}
.donep .card:hover .cardbar,
.donep .card:focus-within .cardbar{display:flex}
.mini{background:var(--card);border:1px solid var(--line);border-radius:6px;font-size:11px;padding:3px 10px;cursor:pointer}
.mini:hover{border-color:var(--mut)}
.mini.pri{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:600}
.mini.warn{border-color:var(--pot);color:var(--pot)}
/* odbavení — jediný výrazný prvek na kartě, zbytek je tichý odkaz */
.tickbox{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;font-weight:600;
         color:var(--ink);background:none;border:none;border-radius:6px;padding:2px 0;margin:0}
.tickbox:hover{color:var(--ok)}
.tickbox input{width:17px;height:17px;margin:0;accent-color:var(--ok);cursor:pointer}
.mini.ghost{color:var(--mut);border-color:var(--line2);padding:3px 9px;font-size:11px}
.mini.ghost:hover{color:var(--ink);border-color:var(--line)}
.cardbar .lnk{margin-left:auto}
.lnk{background:none;border:none;color:var(--mut);font-size:11px;cursor:pointer;text-decoration:underline;padding:0}
.lnk:hover{color:var(--ink)}
.why{font-size:10.5px;color:var(--pot);display:flex;align-items:center;gap:4px}
.evid{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.evid select{font:inherit;font-size:10.5px;background:var(--card);color:var(--ink);border:1px solid var(--line);
             border-radius:5px;padding:1px 4px}
.colempty{padding:16px;color:var(--faint);font-size:12px;font-style:italic}
/* dorovná výšku za chybějící progress bar, ať hlavičky všech sloupců lícují */
.col-h.nobar{padding-bottom:27px}
/* poznámky operátora */
.notes{padding:12px 14px;display:flex;flex-direction:column;gap:10px;height:100%}
.notes textarea{width:100%;flex:1;min-height:220px;resize:vertical;border:1px solid var(--line);
   border-radius:9px;background:var(--well);color:var(--ink);padding:11px 12px;
   font:12.5px/1.65 inherit}
.notes textarea:focus{outline:none;border-color:var(--accent);background:var(--card)}
.notes .hint{font-size:10.5px;color:var(--faint)}

/* zóny 2. sloupce */
.zone-h{position:sticky;top:0;z-index:5;padding:10px 18px 8px;background:var(--card);font-size:11.5px;font-weight:700;
        letter-spacing:.07em;display:flex;align-items:center;gap:8px;color:var(--ink);text-transform:uppercase;
        border-bottom:1px solid var(--line)}
.zone-h .c{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;color:var(--mut);letter-spacing:0}
/* výchozí zóna (riziko / kategorie) = bílá jako 1. sloupec, karty šedé — stejný princip */
.zgroup{background:var(--card)}
.zgroup .zone-h{background:var(--card);border-bottom-color:var(--line)}
.zgroup .card{background:var(--card)}
/* „Čekáme na klienta“ nemá sekce, karty ale mají být bílé stejně jako v ostatních sloupcích */
.col-wait .card{background:var(--card)}
/* seskupení podle stavu → barvu nese celá sekce, karty uvnitř zbělají */
.zt-ok{--zt:var(--ok)} .zt-zji{--zt:var(--zji)} .zt-res{--zt:var(--res)} .zt-inf{--zt:var(--inf)}
.zt-pot{--zt:var(--pot)} .zt-zme{--zt:var(--zme)} .zt-rus{--zt:var(--rus)} .zt-cek{--zt:var(--cek)}
.zgroup.tint{background:color-mix(in srgb,var(--zt) 7%,var(--card))}
.zgroup.tint .zone-h{background:color-mix(in srgb,var(--zt) 17%,var(--card));
        border-bottom-color:color-mix(in srgb,var(--zt) 30%,transparent);color:var(--ink)}
.zgroup.tint .card{background:var(--card)}
/* mimo režim „stav“ nese stav karta sama — barevný pruh vlevo */
.m-ok{--sc:var(--ok)} .m-zji{--sc:var(--zji)} .m-res{--sc:var(--res)} .m-inf{--sc:var(--inf)}
.m-pot{--sc:var(--pot)} .m-zme{--sc:var(--zme)} .m-rus{--sc:var(--rus)} .m-cek{--sc:var(--cek)}
.card.mark{border-left:3px solid var(--sc);padding-left:11px}
/* odlehčená karta — bez rámečku voleb, stav jen ikonou */
/* název položky je nadpis, vybraná volba je sdělení pod ním — liší se velikostí i řezem */
.chosen{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;
        padding:0;margin-top:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--ink);line-height:1.4}
.chosen:hover{color:var(--accent)}
.chosen .ct{flex:1}
.chosen .tg{display:flex;gap:4px;font-size:11px;opacity:.7;font-weight:400}

/* zámek při červené */
.locked .col:not(.donep) .card{opacity:.45;pointer-events:none}
.locked .ctxbox,.locked .catnav{opacity:.45;pointer-events:none}

/* ============ hover panel ============ */
#pop{position:fixed;z-index:80;width:330px;background:var(--card);border:1px solid var(--line);
     border-radius:10px;box-shadow:var(--shadow2);display:none}
#pop.show{display:block}
#pop .pop-h{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line2)}
#pop .pop-t{font-weight:650;font-size:12.5px;flex:1}
#pop .pop-b{padding:9px 13px;font-size:12px;color:var(--ink);line-height:1.55}
#pop .pop-b em{color:var(--mut);font-style:italic}
#pop .pop-tags{display:flex;flex-direction:column;gap:4px;padding:8px 13px;border-top:1px solid var(--line2);
     font-size:11px;color:var(--mut)}
#pop::before{content:"";position:absolute;left:-6px;top:var(--ay,18px);width:10px;height:10px;
     background:var(--card);border-left:1px solid var(--line);border-bottom:1px solid var(--line);
     transform:rotate(45deg)}
#pop.left::before{left:auto;right:-6px;transform:rotate(225deg)}
</style>

const PROPOSAL={pojodp:0, plnamoc:0, stat:1, tel:3, dobadoruc:0, objem:1, skok:1, priplatek:1};

/* ═══════════════ STATE ═══════════════ */
const S={sel:{}, agenda:{}, wait:{}, back:{}, evid:{}, accepted:{}, edit:{}, group:'stav',
         dtab:'done', notes:'', prev:null, delta:{},
         navOpen:true, hideDone:false, call:null, callEdit:false,
         sim:{mimoEU:true, pojisteno:false, clo:true, pref:true}};

/* hlavička sloupce s progress barem — ukazuje, kolik z celku je právě tady */
function colHead(kind,title,n,total,extra){
  const d=S.delta[kind]||0;
  const pct=total?Math.round(n/total*100):0;
  return `<div class="col-h">
    <div class="ch-top"><span class="ch-t">${title}</span>${extra||''}
      ${d?`<span class="ch-d ${d>0?'up':'down'}">${d>0?'+':'−'}${Math.abs(d)}</span>`:''}
      <span class="ch-n ${d?'bump':''}">${n}<em>/${total}</em></span></div>
    <div class="ch-bar"><i style="width:${pct}%"></i></div>
  </div>`;
}

const ITEMS=[];
AREAS.forEach(a=>a.groups.forEach(g=>g.items.forEach(it=>{
  it.area=a.name; it.areaId=a.id; it.conds=[a.cond,it.cond].filter(Boolean);
  ITEMS.push(it);
})));
const BY=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const CONDN={mimoEU:'mimo EU',clo:'plnohodnotné clení',pref:'preferenční dohoda',pojisteno:'pojištěno'};

const vis   = it => it.conds.every(c=>S.sim[c]);
const live  = () => ITEMS.filter(vis);
const stOf  = id => S.sel[id]===undefined ? null : BY[id].o[S.sel[id]][1];
const optOf = id => S.sel[id]===undefined ? null : BY[id].o[S.sel[id]];
const proposed = id => BY[id].auto && S.sel[id]===undefined && PROPOSAL[id]!==undefined && !S.accepted[id];

function place(id){
  const s=stOf(id);
  if(!s) return 'todo';
  if(s==='ok'||s==='rus') return 'closed';
  if(S.wait[id]) return 'wait';
  if(S.agenda[id]) return 'closed';
  return 'call';
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const stlab=(s,past)=>`<span class="st"><span class="sic sic-${s}">${ST[s].ic}</span>${past?ST[s].n2:ST[s].n}</span>`;
const sic=(s)=>`<span class="sic sic-${s}">${ST[s].ic}</span>`;
/* volby seřazené podle RANK, uvnitř skupiny drží původní pořadí od klienta */
const ordered=it=>it.o.map((op,i)=>[i,op]).sort((a,b)=>RANK[a[1][1]]-RANK[b[1][1]] || a[0]-b[0]);
const tagchip=t=>`<span title="${TAGS[t][1]}">${TAGS[t][0]}</span>`;

/* ═══════════════ RENDER ═══════════════ */
const board=document.getElementById('board');

function render(){
  const L=live();
  const anyRed=L.some(i=>stOf(i.id)==='rus');
  document.body.classList.toggle('locked',anyRed);
  document.getElementById('ban').classList.toggle('on',anyRed);

  const nTodo=L.filter(i=>place(i.id)==='todo').length;
  const nCall=L.filter(i=>place(i.id)==='call').length;
  const nWait=L.filter(i=>place(i.id)==='wait').length;
  const closed=L.filter(i=>place(i.id)==='closed').length;
  const p=n=>L.length?(n/L.length*100)+'%':'0%';
  /* pruh se plní zleva tím, co je hotové; zbytek pruhu = položky k posouzení */
  document.getElementById('sbar').innerHTML=
    `<i style="width:${p(closed)};background:var(--ok)"></i>`+
    `<i style="width:${p(nWait)};background:var(--cek)"></i>`+
    `<i style="width:${p(nCall)};background:var(--accent2)"></i>`;
  const lg=(c,n,l)=>n?`<span class="lg"><span class="ld" style="background:${c}"></span><b>${n}</b> ${l}</span>`:'';
  document.getElementById('slegend').innerHTML=
    lg('var(--sep)',nTodo,'k posouzení')+lg('var(--accent2)',nCall,'na hovoru')+
    lg('var(--cek)',nWait,'čeká na klienta')+lg('var(--ok)',closed,'hotovo')+
    `<span class="tot">z ${L.length}</span>`;

  const g=document.getElementById('gstat'); const sts=L.map(i=>stOf(i.id)); let k,txt,sub='';
  if(sts.includes('rus')){k='rus';txt='Zásilka se ruší';}
  else if(sts.includes(null)){k='zji';txt='Vyhodnocuje se';sub=`zbývá ${sts.filter(s=>!s).length}`;}
  else if(closed<L.length){k='pot';txt='K odbavení';sub=`${L.length-closed} položek`;}
  else if(sts.includes('inf')||sts.includes('pot')||sts.includes('zme')){k='ok';txt='Posílá se s nálezy';}
  else {k='ok';txt='Posílá se v pořádku';}
  g.className='gstat g-'+k;
  g.innerHTML=`${sic(k)}${esc(txt)}${sub?` <span class="gsub">· ${esc(sub)}</span>`:''}`;

  const call = L.filter(i=>place(i.id)==='call');
  const wait = L.filter(i=>place(i.id)==='wait');
  const done = L.filter(i=>place(i.id)==='closed');
  const todo = L.filter(i=>place(i.id)==='todo');

  /* delta oproti minulému renderu — ať je vidět, že položka přeskočila jinam */
  const now={todo:todo.length,call:call.length,wait:wait.length,done:done.length,total:L.length};
  S.delta={};
  if(S.prev && S.prev.total===now.total)
    ['todo','call','wait','done'].forEach(k=>{const d=now[k]-S.prev[k]; if(d) S.delta[k]=d;});
  S.prev=now;
  S.total=L.length;

  board.className = 'board'+(S.navOpen?'':' navclosed');
  board.innerHTML = colNav(L) + colEval(todo) + colCall(call) +
    `<div class="stack">${colWait(wait)}${colDone(done)}</div>`;
  measure();
}

/* ---------- volby ---------- */
/* excludeZji: picker „vybrat výsledek“ po hovoru — bez voleb „nevíme“ */
function optsHTML(it,selIdx,extraRow,past){
  let rows='',last=null;
  ordered(it).forEach(([i,op])=>{
    if(past && op[1]==='zji') return;          /* po hovoru „nevíme“ není platný výsledek */
    const r=RANK[op[1]];
    if(last!==null && r!==last) rows+='<div class="osep"></div>';
    last=r;
    const sel=selIdx===i;
    rows+=`<button class="orow s-${op[1]} ${sel?'sel':''}" data-opt="${it.id}:${i}" data-pop="${it.id}:${i}">
        <span class="rd"></span>
        <span class="txt">${esc(op[0])}</span>
        <span class="tg">${op[3].map(tagchip).join('')}</span>
        ${stlab(op[1],past)}
        <span class="info" title="popis volby">i</span>
      </button>`;
  });
  return `<div class="opts">${rows}${extraRow||''}</div>`;
}
function selRowHTML(it,editable,past){
  const i=S.sel[it.id], op=it.o[i];
  return `<div class="opts"><button class="orow s-${op[1]} sel" data-pop="${it.id}:${i}" ${editable?`data-editsel="${it.id}" title="klik = změnit volbu"`:''}>
      <span class="rd"></span><span class="txt">${esc(op[0])}</span>
      <span class="tg">${op[3].map(tagchip).join('')}</span>${stlab(op[1],past)}
      <span class="info">i</span></button></div>`;
}

/* ---------- jednotná karta ---------- */
function cardHTML(it,mode,mark,noCrumb){
  const st=stOf(it.id);
  const a=AREAS.find(x=>x.id===it.areaId);
  const rel=(it.rel||[]).map(k=>{const kv=a&&a.ctx.find(c=>c[0]===k);
    return kv?`${esc(kv[0])}: <b>${esc(kv[1])}</b>`:'';}).filter(Boolean).join(' · ');
  const editing=S.edit[it.id];

  let body='',actions='',extra='';
  if(mode==='todo'){
    body=(it.d?`<p class="dsc">${esc(it.d)}</p>`:'')+optsHTML(it,S.sel[it.id],false,false);
  }else{
    const past=mode!=='closed';
    const i=S.sel[it.id], op=it.o[i];
    /* jednotná karta ve všech režimech — stav nese ikona (a mimo režim „stav“ i pruh vlevo) */
    const compact=`<button class="chosen" data-pop="${it.id}:${i}" data-editsel="${it.id}" title="klik = změnit volbu">
        ${sic(st)}<span class="ct">${esc(op[0])}</span><span class="tg">${op[3].map(tagchip).join('')}</span></button>`;
    /* čekání na klienta je poslední volba v boxu — může nastat po hovoru u kteréhokoli stavu
       (klient teprve zjistí, rozhodne se, doloží doklad nebo potvrdí riziko) */
    const cekaRow = mode==='call'
      ? `<div class="osep"></div>
         <button class="orow s-cek" data-wait="${it.id}">
           <span class="rd"></span><span class="txt">Čekáme na vyjádření klienta</span>
           <span class="tg"></span>${stlab('cek',true)}<span class="info"> </span></button>` : '';
    body=(editing?optsHTML(it,i,cekaRow,past):compact)+
         (rel&&mode!=='closed'?`<div class="rel">${rel}</div>`:'');
    const jine=`<button class="lnk" data-edit="${it.id}">${editing?'zpět':'jiný výsledek'}</button>`;
    if(mode==='call'&&(st==='zji'||st==='res'))
      /* dočasný stav — odškrtnout nelze, musí se zaznamenat výsledek */
      actions=`<button class="mini" data-edit="${it.id}">${editing?'Zpět':'Vybrat výsledek'}</button>`;
    else if(mode==='closed')
      actions=`<button class="lnk" data-return="${it.id}" style="margin-left:0">↩ vrátit k vyhodnocení</button>`;
    else
      actions=`<label class="tickbox"><input type="checkbox" data-tick="${it.id}"> ${st==='inf'?'Informován':'Potvrzeno'}</label>${jine}`;
  }
  return `<div class="card ${mark?'mark m-'+(mode==='wait'?'cek':st):''}" data-rel="${(it.rel||[]).join('|')}">
    ${mode!=='todo'&&mode!=='closed'&&!noCrumb?`<div class="crumb">${esc(it.area)}</div>`:''}
    <div class="hd"><span class="nm">${esc(it.n)}</span>
      ${mode==='todo'&&it.conds.length?`<span class="cnd">jen když: ${it.conds.map(c=>esc(CONDN[c]||c)).join(' + ')}</span>`:''}
      ${it.warn?`<span class="flag" title="${esc(it.warn)}">⚠ k vyjasnění</span>`:''}</div>
    ${body}
    ${actions?`<div class="cardbar">${actions}</div>`:''}
    ${extra}
  </div>`;
}

/* ---------- přehledový sloupec ---------- */
function colNav(L){
  if(!S.navOpen) return `<div class="col col-nav closed">
    <button class="navtoggle" data-navtoggle="1" title="Rozbalit obsah">›</button>
    <span class="vlabel">Obsah</span></div>`;
  const rows=AREAS.filter(a=>!a.cond||S.sim[a.cond]).map(a=>{
    const items=a.groups.flatMap(g=>g.items).filter(vis);
    if(!items.length) return '';
    const hotovo=items.filter(i=>place(i.id)==='closed').length;
    if(S.hideDone && hotovo===items.length) return '';
    const dots=items.map(i=>{
      const st=stOf(i.id), pl=place(i.id);
      const k=pl==='wait'?'cek':st;
      return `<span class="dot ${k?'f s-'+k:''}" title="${esc(i.n)} — ${k?ST[k].n:'nevyhodnoceno'}"></span>`;
    }).join('');
    /* skrolovat lze jen tam, kde v 1. sloupci ještě něco zbylo */
    const kSkrolovani=items.some(i=>place(i.id)==='todo');
    return `<button class="navrow" data-nav="${a.id}" ${kSkrolovani?'':'disabled title="Všechny položky už jsou v dalších sloupcích"'}>
      <span class="t"><span class="nm">${esc(a.name)}</span><span class="c">${hotovo}/${items.length}</span></span>
      <span class="dots">${dots}</span></button>`;
  }).join('');
  const skryto=AREAS.filter(a=>(!a.cond||S.sim[a.cond])).filter(a=>{
    const it=a.groups.flatMap(g=>g.items).filter(vis);
    return it.length && it.every(i=>place(i.id)==='closed');}).length;
  return `<div class="col col-nav">
    <div class="col-h nobar"><div class="ch-top"><span class="ch-t">Obsah</span>
      <span class="ch-n">${L.length}<em> pol.</em></span>
      <button class="navtoggle" data-navtoggle="1" title="Sbalit obsah">‹</button></div></div>
    <div class="navfilt"><button class="navchk ${S.hideDone?'on':''}" data-hidedone="1">
      <span class="box">✓</span> Skrýt hotové kategorie${S.hideDone&&skryto?` <span style="font-weight:400">(${skryto})</span>`:''}</button></div>
    <div class="col-b">${rows||'<div class="colempty">Vše hotové.</div>'}</div></div>`;
}

/* ---------- sloupec 1 ---------- */
function colEval(todo){
  const inner=AREAS.filter(a=>!a.cond||S.sim[a.cond]).map(a=>{
    const items=a.groups.flatMap(g=>g.items).filter(it=>vis(it)&&place(it.id)==='todo');
    if(!items.length) return '';
    const all=a.groups.flatMap(g=>g.items).filter(vis).length;
    return `<div class="area" id="ar-${a.id}">
      <div class="area-h">
        <div class="area-t"><h2>${esc(a.name)}</h2><span class="pr">zbývá ${items.length} z ${all}</span></div>
        <div class="ctxbox">${a.ctx.map(([k,v])=>`<span class="kv" data-k="${esc(k)}">${esc(k)}: <b>${esc(v)}</b></span>`).join('')}</div>
      </div>
      ${a.groups.map(g=>{
        const gi=g.items.filter(it=>vis(it)&&place(it.id)==='todo'); if(!gi.length) return '';
        return (g.n?`<div class="grp">${esc(g.n)}</div>`:'')+`<div class="cards">${gi.map(it=>cardHTML(it,'todo')).join('')}</div>`;
      }).join('')}
    </div>`;
  }).join('');
  return `<div class="col col-todo">${colHead('todo','K vyhodnocení',todo.length,S.total)}
    <div class="col-b" id="cb1">${inner||'<div class="colempty">Vše vyhodnoceno.</div>'}</div></div>`;
}

/* hovor je samostatná věc, na kterou se položky navěšují — ne vlastnost položky */
function callPlan(n){
  const pol=n===1?'položka':n>=2&&n<=4?'položky':'položek';
  if(S.callEdit){
    const t=new Date(Date.now()+36e5);
    return `<div class="callplan">
      <div class="cp-h">Naplánovat hovor</div>
      <div class="cp-f">
        <input type="date" id="cpDate" value="${S.call?S.call.d:t.toISOString().slice(0,10)}">
        <input type="time" id="cpTime" value="${S.call?S.call.t:String(t.getHours()).padStart(2,'0')+':00'}">
        <button class="mini" data-cpsave="1">Uložit</button>
        <button class="lnk" data-cpcancel="1" style="margin-left:0">zpět</button>
      </div></div>`;
  }
  if(!S.call) return `<div class="callplan">
      <div class="cp-h">Hovor</div>
      <div class="cp-s">Zatím není naplánovaný · na agendě ${n} ${pol}</div>
      <div class="cp-f"><button class="mini" data-cpedit="1">Naplánovat hovor</button></div></div>`;
  const d=new Date(S.call.d+'T00:00');
  const den=['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'][d.getDay()];
  return `<div class="callplan">
    <div class="cp-h">Hovor</div>
    <div class="cp-s"><span class="when">${den} ${d.getDate()}. ${d.getMonth()+1}. · ${esc(S.call.t)}</span>
      &nbsp;· na agendě ${n} ${pol}</div>
    <div class="cp-f"><button class="lnk" data-cpedit="1" style="margin-left:0">přeplánovat</button>
      <button class="lnk" data-cpdel="1" style="margin-left:0">zrušit</button></div></div>`;
}

/* ---------- sloupec 2 ---------- */
function colCall(call){
  let zones;
  if(S.group==='stav'){
    /* barvu nese celá zóna → karty uvnitř stav neopakují */
    zones=[['zji','K zjištění',i=>stOf(i.id)==='zji'],
           ['res','K vyřešení',i=>stOf(i.id)==='res'],
           ['inf','Informovat',i=>stOf(i.id)==='inf'],
           ['pot','Potvrdit',   i=>['pot','zme'].includes(stOf(i.id))]]
      .map(([k,label,f])=>({k,tint:k,label,items:call.filter(f)}));
  }else if(S.group==='tema'){
    const order=['cena','dok','cas','stop','data'];
    zones=order.map(t=>({k:null,label:TAGS[t][0]+' '+TAGS[t][1],
      items:call.filter(i=>(optOf(i.id)[3][0]||null)===t)}));
    zones.push({k:null,label:'Bez rizika',items:call.filter(i=>!optOf(i.id)[3].length)});
    zones=zones.filter(z=>z.items.length);
  }else{
    /* podle hlavních kategorií — stejné členění jako levý sloupec, včetně prázdných */
    zones=AREAS.filter(a=>!a.cond||S.sim[a.cond])
      .map(a=>({k:null,label:a.name,items:call.filter(i=>i.areaId===a.id)}));
  }
  const seg=(v,l)=>`<button data-grp="${v}" class="${S.group===v?'on':''}">${l}</button>`;
  const segs=`<span class="segs">${seg('stav','stav')}${seg('tema','riziko')}${seg('kat','kategorie')}</span>`;
  return `<div class="col col-call">${colHead('call','K hovoru',call.length,S.total,segs)}
    <div class="col-b">${callPlan(call.length)}${call.length?zones.map(z=>`<div class="zgroup ${z.tint?'tint zt-'+z.tint:''}">
        <div class="zone-h">${z.k?sic(z.k):''} ${esc(z.label)} <span class="c">${z.items.length}</span></div>
        <div class="cards">${z.items.length?z.items.map(it=>cardHTML(it,'call',!z.tint,S.group==='kat')).join(''):'<div class="colempty" style="padding:4px 2px">prázdné</div>'}</div></div>`).join('')
      :'<div class="colempty">Nic k hovoru.</div>'}</div></div>`;
}

/* ---------- sloupec 3 ---------- */
function colWait(wait){
  return `<div class="col waitp col-wait">${colHead('wait','Čekáme na klienta',wait.length,S.total)}
    <div class="col-b">${wait.length?`<div class="cards">${wait.map(it=>cardHTML(it,'wait',true)).join('')}</div>`:'<div class="colempty">Nic nečeká.</div>'}</div></div>`;
}
function colDone(done){
  const segs=`<span class="segs"><button data-dtab="done" class="${S.dtab==='done'?'on':''}">uzavřené</button><button data-dtab="notes" class="${S.dtab==='notes'?'on':''}">poznámky</button></span>`;
  if(S.dtab==='notes')
    return `<div class="col donep col-done">
      <div class="col-h nobar"><div class="ch-top"><span class="ch-t">Poznámky</span>${segs}</div></div>
      <div class="col-b"><div class="notes">
        <textarea id="notesArea" placeholder="Volné poznámky operátora k této zásilce — co zaznělo v hovoru, na co nezapomenout…">${esc(S.notes)}</textarea>
        <span class="hint">Ukládá se k zásilce, ne k jednotlivé položce.</span>
      </div></div></div>`;
  /* seskupení podle oblastí, červené drží pořadí uvnitř své oblasti */
  const groups=AREAS.map(a=>({a,items:done.filter(i=>i.areaId===a.id)})).filter(g=>g.items.length);
  return `<div class="col donep col-done">${colHead('done','Uzavřené',done.length,S.total,segs)}
    <div class="col-b">${done.length?groups.map(g=>`<div class="zgroup">
      <div class="zone-h">${esc(g.a.name)} <span class="c">${g.items.length}</span></div>
      <div class="cards">${g.items.map(it=>cardHTML(it,'closed',true)).join('')}</div></div>`).join('')
    :'<div class="colempty">Zatím nic.</div>'}</div></div>`;
}

/* ═══════════════ HOVER PANEL ═══════════════ */
const pop=document.getElementById('pop');
let popKey=null, hideT=null;
function showPop(el){
  const [id,ix]=el.dataset.pop.split(':');
  const it=BY[id]; if(!it||!it.o[+ix]) return;
  const op=it.o[+ix];
  if(popKey===el.dataset.pop && pop.classList.contains('show')) return;
  popKey=el.dataset.pop;
  pop.innerHTML=`<div class="pop-h">${stlab(op[1])}<span class="pop-t">${esc(op[0])}</span></div>
    <div class="pop-b">${op[2]?esc(op[2]):'<em>Bez doplňujícího popisu — volba je samovysvětlující.</em>'}</div>
    ${op[3].length?`<div class="pop-tags">${op[3].map(t=>`<span>${TAGS[t][0]} ${esc(TAGS[t][1])}</span>`).join('')}</div>`:''}`;
  pop.classList.add('show'); pop.classList.remove('left');
  const r=el.getBoundingClientRect();
  pop.style.top='0px'; pop.style.left='0px';
  const pw=pop.offsetWidth, ph=pop.offsetHeight;
  let x=r.right+12, y=r.top+r.height/2-18;
  if(x+pw>innerWidth-8){ x=r.left-pw-12; pop.classList.add('left'); }
  if(y+ph>innerHeight-8) y=innerHeight-ph-8;
  if(y<58) y=58;
  pop.style.left=x+'px'; pop.style.top=y+'px';
  pop.style.setProperty('--ay',Math.max(10,Math.min(ph-20,r.top+r.height/2-y-5))+'px');
}
function hidePop(){ pop.classList.remove('show'); popKey=null; }

document.addEventListener('mouseover',e=>{
  const el=e.target.closest('[data-pop]');
  if(el){ clearTimeout(hideT); showPop(el); return; }
  if(e.target.closest('#pop')){ clearTimeout(hideT); return; }
  hideT=setTimeout(hidePop,120);
  const row=e.target.closest('[data-rel]');
  if(row){
    const rel=row.dataset.rel?row.dataset.rel.split('|'):[];
    row.closest('.col-b')?.querySelectorAll('.kv').forEach(k=>k.classList.toggle('hi',rel.includes(k.dataset.k)));
  }
});
addEventListener('scroll',hidePop,{passive:true,capture:true});

/* ═══════════════ EVENTS ═══════════════ */
document.addEventListener('click',e=>{
  const t=e.target, C=s=>t.closest(s);
  let el;
  if(el=C('[data-opt]')){
    const [id,i]=el.dataset.opt.split(':');
    const prior=place(id);                       /* kde karta byla před změnou */
    S.sel[id]=+i; delete S.agenda[id]; delete S.wait[id]; delete S.back[id]; delete S.edit[id]; S.accepted[id]=1;
    /* výsledek vybraný po hovoru = hovor už proběhl → finální stavy jdou rovnou do Uzavřených */
    if((prior==='call'||prior==='wait') && ['inf','pot','zme'].includes(BY[id].o[+i][1])) S.agenda[id]=1;
    hidePop(); return render();
  }
  if(el=C('[data-editsel]')){S.edit[el.dataset.editsel]=1;hidePop();return render();}
  if(el=C('[data-edit]')){const id=el.dataset.edit;S.edit[id]=!S.edit[id];hidePop();return render();}
  if(el=C('[data-grp]')){S.group=el.dataset.grp;return render();}
  if(el=C('[data-dtab]')){S.dtab=el.dataset.dtab;return render();}
  if(C('[data-navtoggle]')){S.navOpen=!S.navOpen;return render();}
  if(C('[data-hidedone]')){S.hideDone=!S.hideDone;return render();}
  if(C('[data-cpedit]')){S.callEdit=true;return render();}
  if(C('[data-cpcancel]')){S.callEdit=false;return render();}
  if(C('[data-cpdel]')){S.call=null;S.callEdit=false;return render();}
  if(C('[data-cpsave]')){
    S.call={d:document.getElementById('cpDate').value,t:document.getElementById('cpTime').value};
    S.callEdit=false;return render();
  }
  if(el=C('[data-tick]')){S.agenda[el.dataset.tick]=1;delete S.wait[el.dataset.tick];delete S.edit[el.dataset.tick];return render();}
  if(el=C('[data-wait]')){S.wait[el.dataset.wait]=1;delete S.edit[el.dataset.wait];return render();}
  if(el=C('[data-back]')){const id=el.dataset.back;delete S.sel[id];delete S.agenda[id];delete S.wait[id];delete S.edit[id];
    S.back[id]='vráceno z hovoru — čeká na nové rozhodnutí'; hidePop(); render();
    document.getElementById('ar-'+BY[id].areaId)?.scrollIntoView({behavior:'smooth',block:'start'}); return;}
  if(el=C('[data-return]')){const id=el.dataset.return;delete S.sel[id];delete S.agenda[id];delete S.wait[id];delete S.edit[id];
    hidePop(); render();
    document.getElementById('ar-'+BY[id].areaId)?.scrollIntoView({behavior:'smooth',block:'start'}); return;}
  if(el=C('[data-nav]')){
    document.getElementById('ar-'+el.dataset.nav)?.scrollIntoView({behavior:'smooth',block:'start'}); return;}
});
document.addEventListener('change',e=>{
  if(e.target.dataset.evid){S.evid[e.target.dataset.evid]=e.target.value;render();}
});
/* poznámky se ukládají bez překreslení, ať operátor nepřijde o kurzor */
document.addEventListener('input',e=>{ if(e.target.id==='notesArea') S.notes=e.target.value; });
function measure(){
  const th=document.getElementById('tophdr').offsetHeight+
           (document.getElementById('ban').classList.contains('on')?document.getElementById('ban').offsetHeight:0);
  document.documentElement.style.setProperty('--th',th+'px');
}
addEventListener('resize',measure);
render();
</script>
